<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ADORE'S PET — Cart</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Bengali","Noto Sans",sans-serif;
  background:#f6f9f7;
  color:#10251d;
  line-height:1.5;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   HEADER
========================= */

.site-header{
  width:100%;
  background:#fff;
  border-bottom:1px solid #dfe8e3;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  min-height:105px;
  margin:auto;
  padding:14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand-logo{
  display:flex;
  align-items:center;
  height:78px;
}

.brand-logo img{
  display:block;
  height:72px;
  width:auto;
  max-width:280px;
  object-fit:contain;
}

.home-btn{
  background:#19733f;
  color:#fff;
  padding:14px 22px;
  border-radius:15px;
  font-size:18px;
  font-weight:700;
}


/* =========================
   MAIN
========================= */

.main{
  max-width:1000px;
  margin:auto;
  padding:45px 20px 80px;
}

.page-title{
  text-align:center;
  color:#19733f;
  font-size:38px;
  font-weight:800;
  margin-bottom:35px;
}


/* =========================
   CART
========================= */

.cart-box{
  background:#fff;
  border:1px solid #d9e3de;
  border-radius:22px;
  padding:25px;
  box-shadow:0 5px 20px rgba(16,37,29,.06);
}

.cart-item{
  display:flex;
  align-items:center;
  gap:18px;
  padding:18px 0;
  border-bottom:1px solid #e0e6e3;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-image{
  width:110px;
  height:110px;
  min-width:110px;
  object-fit:cover;
  border-radius:14px;
  background:#eee;
}

.cart-info{
  flex:1;
  min-width:0;
}

.cart-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:6px;
}

.cart-price{
  color:#19733f;
  font-size:18px;
  font-weight:800;
}

.quantity-box{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.quantity-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:8px;
  background:#19733f;
  color:#fff;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
}

.quantity{
  min-width:38px;
  text-align:center;
  font-size:18px;
  font-weight:800;
}

.remove-btn{
  border:0;
  background:#c62828;
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.item-total{
  min-width:120px;
  text-align:right;
  font-size:18px;
  font-weight:800;
}


/* =========================
   EMPTY CART
========================= */

.empty-cart{
  text-align:center;
  padding:60px 20px;
}

.empty-icon{
  font-size:65px;
  margin-bottom:15px;
}

.empty-cart h2{
  margin-bottom:10px;
}

.empty-cart p{
  color:#777;
  margin-bottom:25px;
}

.shop-btn{
  display:inline-block;
  background:#19733f;
  color:#fff;
  padding:13px 25px;
  border-radius:12px;
  font-size:17px;
  font-weight:700;
}


/* =========================
   SUMMARY
========================= */

.summary{
  margin-top:25px;
  background:#eef8f2;
  border-radius:18px;
  padding:22px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-bottom:12px;
  font-size:18px;
}

.summary-total{
  border-top:1px solid #c9ddd2;
  margin-top:15px;
  padding-top:15px;
  font-size:24px;
  font-weight:800;
  color:#19733f;
}

.checkout-btn{
  width:100%;
  margin-top:20px;
  border:0;
  background:#19733f;
  color:#fff;
  padding:16px;
  border-radius:12px;
  font-size:19px;
  font-weight:800;
  cursor:pointer;
}


/* =========================
   FOOTER
========================= */

footer{
  background:#06251a;
  color:#fff;
  padding:55px 24px 28px;
  text-align:center;
}

.footer-brand{
  font-size:30px;
  font-weight:800;
  margin-bottom:10px;
}

.footer-tagline{
  color:#b8c8c1;
  font-size:17px;
  margin-bottom:32px;
}

.footer-line{
  height:1px;
  background:rgba(255,255,255,.18);
  max-width:900px;
  margin:0 auto 22px;
}

.copyright{
  color:#9eafa8;
  font-size:14px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .header-inner{
    min-height:88px;
    padding:10px 16px;
  }

  .brand-logo{
    height:62px;
  }

  .brand-logo img{
    height:58px;
    max-width:170px;
  }

  .home-btn{
    padding:10px 14px;
    font-size:15px;
    border-radius:12px;
  }

  .main{
    padding:35px 12px 60px;
  }

  .page-title{
    font-size:30px;
    margin-bottom:25px;
  }

  .cart-box{
    padding:15px;
    border-radius:18px;
  }

  .cart-item{
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
  }

  .cart-image{
    width:80px;
    height:80px;
    min-width:80px;
  }

  .cart-info{
    width:calc(100% - 95px);
  }

  .cart-title{
    font-size:17px;
  }

  .cart-price{
    font-size:16px;
  }

  .item-total{
    width:100%;
    text-align:left;
    padding-left:90px;
    font-size:17px;
  }

  .remove-btn{
    margin-left:auto;
  }

  .summary{
    padding:18px;
  }

  .summary-total{
    font-size:21px;
  }

  .footer-brand{
    font-size:25px;
  }

}


/* =========================
   VERY SMALL
========================= */

@media(max-width:380px){

  .brand-logo img{
    max-width:140px;
  }

  .home-btn{
    font-size:14px;
    padding:9px 11px;
  }

  .cart-image{
    width:70px;
    height:70px;
    min-width:70px;
  }

  .cart-info{
    width:calc(100% - 85px);
  }

  .item-total{
    padding-left:80px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="site-header">

  <div class="header-inner">

    <a
      href="index.html"
      class="brand-logo"
    >

      <img
        src="logo.png.png"
        alt="ADORE'S PET"
      >

    </a>


    <a
      href="index.html"
      class="home-btn"
    >
      ← Home
    </a>

  </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="main">

  <h1 class="page-title">
    🛒 আপনার Cart
  </h1>


  <div
    id="cartContainer"
    class="cart-box"
  >

    <!-- JavaScript এখানে Cart দেখাবে -->

  </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

  <div class="footer-brand">
    🐰 ADORE'S PET
  </div>

  <div class="footer-tagline">
    আপনার বিশ্বস্ত Pet Shop
  </div>

  <div class="footer-line"></div>

  <div class="copyright">
    © 2026 ADORE'S PET — All Rights Reserved
  </div>

</footer>



<script>

/* =====================================================
   ADORE'S PET — CART SYSTEM
===================================================== */


/* =========================
   GET CART
========================= */

function getCart(){

  try{

    const saved =
      localStorage.getItem("cart");

    if(!saved){
      return [];
    }

    const cart =
      JSON.parse(saved);

    return Array.isArray(cart)
      ? cart
      : [];

  }

  catch(error){

    console.error(
      "Cart read error:",
      error
    );

    return [];

  }

}


/* =========================
   SAVE CART
========================= */

function saveCart(cart){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}


/* =========================
   PRODUCT ID
========================= */

function getProductId(item,index){

  return String(
    item.id ??
    item.product_id ??
    item.productId ??
    item.title ??
    item.name ??
    index
  );

}


/* =========================
   PRODUCT TITLE
========================= */

function getTitle(item){

  return (
    item.title ??
    item.name ??
    item.product_name ??
    "Product"
  );

}


/* =========================
   PRODUCT PRICE
========================= */

function getPrice(item){

  return Number(
    item.price ??
    item.product_price ??
    item.unit_price ??
    0
  );

}


/* =========================
   PRODUCT IMAGE
========================= */

function getImage(item){

  return (
    item.image_url ??
    item.image ??
    item.imageUrl ??
    item.photo ??
    ""
  );

}


/* =========================
   QUANTITY
========================= */

function getQuantity(item){

  const quantity =
    Number(
      item.quantity ??
      item.qty ??
      1
    );

  return quantity > 0
    ? quantity
    : 1;

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartContainer"
    );


  const cart =
    getCart();


  /* EMPTY */

  if(!cart.length){

    container.innerHTML = `

      <div class="empty-cart">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          আপনার Cart খালি
        </h2>

        <p>
          এখনো কোনো Product Cart-এ যোগ করা হয়নি।
        </p>

        <a
          href="index.html"
          class="shop-btn"
        >
          🛍️ Shopping শুরু করুন
        </a>

      </div>

    `;

    return;

  }


  let subtotal = 0;

  let totalQuantity = 0;


  let html = "";


  cart.forEach(
    function(item,index){

      const id =
        getProductId(
          item,
          index
        );

      const title =
        getTitle(item);

      const price =
        getPrice(item);

      const image =
        getImage(item);

      const quantity =
        getQuantity(item);

      const itemTotal =
        price * quantity;


      subtotal += itemTotal;

      totalQuantity += quantity;


      html += `

        <div
          class="cart-item"
          data-index="${index}"
        >

          ${
            image

            ?

            `

            <img
              class="cart-image"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(title)}"
            >

            `

            :

            `

            <div
              class="cart-image"
              style="
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:35px;
              "
            >
              🐰
            </div>

            `
          }


          <div class="cart-info">

            <div class="cart-title">

              ${escapeHTML(title)}

            </div>


            <div class="cart-price">

              ৳${formatMoney(price)}

            </div>


            <div class="quantity-box">

              <button
                class="quantity-btn"
                onclick="changeQuantity(${index},-1)"
              >
                −
              </button>


              <span class="quantity">

                ${quantity}

              </span>


              <button
                class="quantity-btn"
                onclick="changeQuantity(${index},1)"
              >
                +
              </button>

            </div>

          </div>


          <div class="item-total">

            ৳${formatMoney(itemTotal)}

          </div>


          <button
            class="remove-btn"
            onclick="removeItem(${index})"
          >
            🗑️ Remove
          </button>

        </div>

      `;

    }
  );


  html += `

    <div class="summary">

      <div class="summary-row">

        <span>
          মোট Product
        </span>

        <strong>
          ${cart.length}
        </strong>

      </div>


      <div class="summary-row">

        <span>
          মোট Quantity
        </span>

        <strong>
          ${totalQuantity}
        </strong>

      </div>


      <div class="summary-row summary-total">

        <span>
          সর্বমোট
        </span>

        <strong>
          ৳${formatMoney(subtotal)}
        </strong>

      </div>


      <button
        class="checkout-btn"
        onclick="checkout()"
      >
        📦 Checkout / Order করুন
      </button>

    </div>

  `;


  container.innerHTML =
    html;

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(
  index,
  change
){

  const cart =
    getCart();


  if(!cart[index]){
    return;
  }


  let quantity =
    getQuantity(
      cart[index]
    );


  quantity += change;


  if(quantity <= 0){

    cart.splice(
      index,
      1
    );

  }

  else{

    if(
      "quantity"
      in cart[index]
    ){

      cart[index].quantity =
        quantity;

    }

    else{

      cart[index].quantity =
        quantity;

    }

  }


  saveCart(cart);

  renderCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  const cart =
    getCart();


  if(!cart[index]){
    return;
  }


  const title =
    getTitle(
      cart[index]
    );


  const ok =
    confirm(
      `"${title}" Cart থেকে Remove করবেন?`
    );


  if(!ok){
    return;
  }


  cart.splice(
    index,
    1
  );


  saveCart(cart);

  renderCart();

}


/* =========================
   CHECKOUT
========================= */

function checkout(){

  const cart =
    getCart();


  if(!cart.length){

    alert(
      "আপনার Cart খালি।"
    );

    return;

  }


  /*
    আপাতত Checkout চাপলে
    Order information দেখানো হচ্ছে।

    পরে Supabase Orders-এর সাথে
    সরাসরি connect করা যাবে।
  */

  let message =
    "আপনার Cart-এ আছে:\n\n";


  let total = 0;


  cart.forEach(
    function(item){

      const title =
        getTitle(item);

      const price =
        getPrice(item);

      const quantity =
        getQuantity(item);

      const itemTotal =
        price * quantity;


      total += itemTotal;


      message +=
        title +
        " × " +
        quantity +
        " = ৳" +
        formatMoney(itemTotal) +
        "\n";

    }
  );


  message +=
    "\nসর্বমোট: ৳" +
    formatMoney(total);


  alert(message);

}


/* =========================
   FORMAT MONEY
========================= */

function formatMoney(number){

  return Number(
    number || 0
  ).toLocaleString(
    "en-BD"
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   START
========================= */

renderCart();


/* =========================
   UPDATE IF CART CHANGES
========================= */

window.addEventListener(
  "storage",
  function(){

    renderCart();

  }
);

</script>


</body>

</html>
