<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADORE'S PET — Cart</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali","Noto Sans",sans-serif;
  background:#f6f9f7;
  color:#10251d;
  line-height:1.5;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= HEADER ================= */

.site-header{
  background:#fff;
  border-bottom:1px solid #dfe8e3;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  min-height:100px;
  margin:auto;
  padding:12px 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  height:70px;
  width:auto;
  object-fit:contain;
}

.home-btn{
  background:#19733f;
  color:white;

  padding:13px 25px;
  border-radius:15px;

  font-size:18px;
  font-weight:700;
}

/* ================= MAIN ================= */

.container{
  max-width:900px;
  margin:auto;
  padding:50px 20px 80px;
}

.page-title{
  text-align:center;
  color:#19733f;
  font-size:42px;
  margin-bottom:35px;
}

/* ================= CART ================= */

.cart-box{
  background:#fff;
  border:1px solid #d9e3de;
  border-radius:28px;
  padding:30px;

  box-shadow:0 8px 30px rgba(16,37,29,.06);
}

.cart-item{
  display:flex;
  align-items:center;
  gap:20px;

  padding:20px 0;
  border-bottom:1px solid #ddd;
}

.cart-image{
  width:130px;
  height:130px;

  object-fit:cover;

  border-radius:18px;
  background:#eee;

  flex-shrink:0;
}

.item-info{
  flex:1;
  min-width:0;
}

.item-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:8px;
}

.item-price{
  color:#19733f;
  font-size:22px;
  font-weight:800;
  margin-bottom:12px;
}

/* ================= QUANTITY ================= */

.quantity{
  display:flex;
  align-items:center;
  gap:15px;
}

.qty-btn{
  width:48px;
  height:48px;

  border:0;
  border-radius:12px;

  background:#19733f;
  color:#fff;

  font-size:25px;
  font-weight:800;

  cursor:pointer;
}

.qty-btn:disabled{
  background:#aaa;
  cursor:not-allowed;
}

.qty-number{
  min-width:30px;
  text-align:center;
  font-size:22px;
  font-weight:700;
}

.stock-text{
  color:#777;
  margin-top:8px;
  font-size:14px;
}

.remove-btn{
  border:0;
  background:#c62828;
  color:#fff;

  padding:11px 16px;

  border-radius:10px;

  font-size:15px;
  font-weight:700;

  cursor:pointer;

  margin-top:12px;
}

/* ================= SUMMARY ================= */

.summary{
  margin-top:30px;

  background:#eaf6ef;

  border-radius:22px;

  padding:25px;
}

.summary-row{
  display:flex;
  justify-content:space-between;

  font-size:20px;

  margin-bottom:14px;
}

.summary-total{
  border-top:1px solid #c9ddd2;

  padding-top:18px;
  margin-top:18px;

  display:flex;
  justify-content:space-between;

  color:#19733f;

  font-size:30px;
  font-weight:800;
}

/* ================= CHECKOUT ================= */

.checkout{
  margin-top:35px;

  background:#fff;

  border:1px solid #d9e3de;

  border-radius:24px;

  padding:28px;
}

.checkout h2{
  color:#19733f;
  margin-bottom:22px;
  font-size:28px;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;

  font-weight:700;

  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{

  width:100%;

  padding:14px;

  border:1px solid #ccc;

  border-radius:12px;

  font-size:16px;

  outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#19733f;
}

.form-group textarea{
  min-height:110px;
  resize:vertical;
}

.order-btn{
  width:100%;

  border:0;

  background:#19733f;
  color:#fff;

  padding:16px;

  border-radius:14px;

  font-size:19px;
  font-weight:800;

  cursor:pointer;
}

.order-btn:disabled{
  background:#999;
  cursor:not-allowed;
}

.message{
  margin-top:18px;
  text-align:center;
  font-weight:700;
}

/* ================= EMPTY ================= */

.empty{
  text-align:center;
  padding:50px 20px;

  color:#777;

  font-size:22px;
}

/* ================= FOOTER ================= */

footer{
  background:#06251a;

  color:#fff;

  padding:55px 20px 30px;

  text-align:center;
}

.footer-brand{
  font-size:30px;
  font-weight:800;
  margin-bottom:10px;
}

.footer-tagline{
  color:#b8c8c1;
  font-size:17px;
  margin-bottom:30px;
}

.footer-line{
  height:1px;

  background:rgba(255,255,255,.18);

  max-width:900px;

  margin:0 auto 20px;
}

.copyright{
  color:#9eafa8;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .header-inner{
    min-height:82px;
    padding:10px 15px;
  }

  .logo{
    height:55px;
    max-width:150px;
  }

  .home-btn{
    padding:11px 18px;
    font-size:16px;
  }

  .container{
    padding:35px 15px 60px;
  }

  .page-title{
    font-size:32px;
  }

  .cart-box{
    padding:18px;
    border-radius:22px;
  }

  .cart-item{
    align-items:flex-start;
    gap:12px;
  }

  .cart-image{
    width:110px;
    height:110px;
  }

  .item-title{
    font-size:19px;
  }

  .item-price{
    font-size:19px;
  }

  .quantity{
    gap:8px;
  }

  .qty-btn{
    width:42px;
    height:42px;
    font-size:22px;
  }

  .summary-total{
    font-size:25px;
  }

  .checkout{
    padding:20px;
  }

}

@media(max-width:430px){

  .cart-item{
    display:grid;
    grid-template-columns:90px 1fr;
  }

  .cart-image{
    width:90px;
    height:90px;
  }

  .item-title{
    font-size:17px;
  }

  .item-price{
    font-size:18px;
  }

  .remove-btn{
    font-size:13px;
    padding:8px 10px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="site-header">

  <div class="header-inner">

    <a href="index.html">

      <img
        src="logo.png.png"
        class="logo"
        alt="ADORE'S PET"
      >

    </a>

    <a
      href="index.html"
      class="home-btn"
    >
      ← Home
    </a>

  </div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">

  <h1 class="page-title">
    🛒 আপনার Cart
  </h1>


  <!-- CART -->

  <div
    id="cartBox"
    class="cart-box"
  >

    <div id="cartList"></div>

    <div
      id="summary"
      class="summary"
    ></div>

  </div>


  <!-- CHECKOUT -->

  <section
    id="checkout"
    class="checkout"
  >

    <h2>
      📦 Order Details
    </h2>


    <div class="form-group">

      <label>
        আপনার নাম *
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="আপনার পূর্ণ নাম"
        required
      >

    </div>


    <div class="form-group">

      <label>
        মোবাইল নম্বর *
      </label>

      <input
        id="customerPhone"
        type="tel"
        placeholder="01XXXXXXXXX"
        required
      >

    </div>


    <div class="form-group">

      <label>
        জেলা *
      </label>

      <input
        id="district"
        type="text"
        placeholder="যেমন: ঢাকা"
        required
      >

    </div>


    <div class="form-group">

      <label>
        সম্পূর্ণ ঠিকানা *
      </label>

      <textarea
        id="address"
        placeholder="বাসা/গ্রাম, রোড, এলাকা ইত্যাদি লিখুন"
        required
      ></textarea>

    </div>


    <button
      id="orderBtn"
      class="order-btn"
      type="button"
    >
      📦 Order Confirm করুন
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </section>

</main>


<!-- ================= FOOTER ================= -->

<footer>

  <div class="footer-brand">
    🐰 ADORE'S PET
  </div>

  <div class="footer-tagline">
    আপনার বিশ্বস্ত Pet Shop
  </div>

  <div class="footer-line"></div>

  <div class="copyright">
    © 2026 ADORE'S PET — All Rights Reserved
  </div>

</footer>


<!-- ================= SUPABASE ================= -->

<script src="config.js"></script>

<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ================= SUPABASE ================= */

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ================= ELEMENTS ================= */

const cartList =
  document.getElementById("cartList");

const summary =
  document.getElementById("summary");

const checkout =
  document.getElementById("checkout");

const orderBtn =
  document.getElementById("orderBtn");

const message =
  document.getElementById("message");


/* ================= CART ================= */

let cart = [];


try{

  const saved =
    JSON.parse(
      localStorage.getItem("cart") || "[]"
    );

  cart =
    Array.isArray(saved)
      ? saved
      : [];

}catch(error){

  cart = [];

}


/* ================= SAVE CART ================= */

function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}


/* ================= FORMAT MONEY ================= */

function money(value){

  return "৳" +
    Number(value || 0)
      .toLocaleString("en-US");

}


/* ================= RENDER ================= */

function renderCart(){

  cartList.innerHTML = "";

  if(!cart.length){

    cartList.innerHTML = `
      <div class="empty">
        🛒 আপনার Cart খালি।
      </div>
    `;

    summary.innerHTML = "";

    checkout.style.display = "none";

    return;

  }


  checkout.style.display = "block";


  let total = 0;
  let totalQuantity = 0;


  cart.forEach(
    (item,index)=>{

      /* IMPORTANT:
         Stock কখনো 0-এর নিচে হবে না
      */

      const stock =
        Math.max(
          0,
          Number(item.stock || 0)
        );


      /* Quantity limit */

      let quantity =
        Math.max(
          1,
          Number(item.quantity || 1)
        );


      /* Stock-এর বেশি হলে Stock-এ নামিয়ে আনবে */

      if(stock > 0 && quantity > stock){

        quantity = stock;

        item.quantity = stock;

      }


      if(stock === 0){

        quantity = 0;

        item.quantity = 0;

      }


      const price =
        Number(item.price || 0);


      const subtotal =
        price * quantity;


      total += subtotal;

      totalQuantity += quantity;


      const div =
        document.createElement("div");

      div.className =
        "cart-item";


      div.innerHTML = `

        <img
          class="cart-image"
          src="${escapeHTML(
            item.image_url || ""
          )}"
          alt="${escapeHTML(
            item.title || ""
          )}"
        >


        <div class="item-info">

          <div class="item-title">
            ${escapeHTML(
              item.title || "Product"
            )}
          </div>


          <div class="item-price">
            ${money(price)}
          </div>


          <div class="quantity">

            <button
              class="qty-btn minus"
              data-index="${index}"
              ${quantity <= 1 ? "disabled" : ""}
            >
              −
            </button>


            <span class="qty-number">
              ${quantity}
            </span>


            <button
              class="qty-btn plus"
              data-index="${index}"
              ${quantity >= stock ? "disabled" : ""}
            >
              +
            </button>

          </div>


          <div class="stock-text">

            Available Stock:
            <b>${stock}</b>

            ${
              quantity >= stock
              ? "<br>⚠️ Stock limit reached"
              : ""
            }

          </div>


          <button
            class="remove-btn"
            data-index="${index}"
          >
            🗑️ Remove
          </button>

        </div>

      `;


      cartList.appendChild(div);

    }
  );


  saveCart();


  summary.innerHTML = `

    <div class="summary-row">

      <span>
        মোট Product
      </span>

      <b>
        ${cart.length}
      </b>

    </div>


    <div class="summary-row">

      <span>
        মোট Quantity
      </span>

      <b>
        ${totalQuantity}
      </b>

    </div>


    <div class="summary-total">

      <span>
        সর্বমোট
      </span>

      <span>
        ${money(total)}
      </span>

    </div>

  `;


  /* ================= BUTTONS ================= */


  document
    .querySelectorAll(".minus")
    .forEach(button=>{

      button.onclick = ()=>{

        const index =
          Number(
            button.dataset.index
          );

        if(
          Number(
            cart[index].quantity || 1
          ) > 1
        ){

          cart[index].quantity--;

          saveCart();

          renderCart();

        }

      };

    });


  document
    .querySelectorAll(".plus")
    .forEach(button=>{

      button.onclick = ()=>{

        const index =
          Number(
            button.dataset.index
          );


        const stock =
          Number(
            cart[index].stock || 0
          );


        const quantity =
          Number(
            cart[index].quantity || 1
          );


        /* STOCK LIMIT */

        if(quantity >= stock){

          alert(
            "❌ এই Product-এর Stock মাত্র " +
            stock +
            " টি।"
          );

          return;

        }


        cart[index].quantity++;

        saveCart();

        renderCart();

      };

    });


  document
    .querySelectorAll(".remove-btn")
    .forEach(button=>{

      button.onclick = ()=>{

        const index =
          Number(
            button.dataset.index
          );


        cart.splice(
          index,
          1
        );


        saveCart();

        renderCart();

      };

    });

}


/* ================= ORDER ================= */

orderBtn.addEventListener(
  "click",
  async ()=>{

    if(!cart.length){

      alert(
        "❌ Cart খালি।"
      );

      return;

    }


    const customerName =
      document
        .getElementById("customerName")
        .value
        .trim();


    const customerPhone =
      document
        .getElementById("customerPhone")
        .value
        .trim();


    const district =
      document
        .getElementById("district")
        .value
        .trim();


    const address =
      document
        .getElementById("address")
        .value
        .trim();


    if(
      !customerName ||
      !customerPhone ||
      !district ||
      !address
    ){

      message.style.color =
        "#c62828";

      message.textContent =
        "❌ সবগুলো তথ্য পূরণ করুন।";

      return;

    }


    /* ================= PHONE CHECK ================= */

    const phone =
      customerPhone.replace(
        /\s|-/g,
        ""
      );


    if(!/^01[3-9]\d{8}$/.test(phone)){

      message.style.color =
        "#c62828";

      message.textContent =
        "❌ সঠিক মোবাইল নম্বর দিন।";

      return;

    }


    /* ================= STOCK CHECK ================= */

    for(
      const item of cart
    ){

      const stock =
        Number(
          item.stock || 0
        );


      const quantity =
        Number(
          item.quantity || 0
        );


      if(
        quantity <= 0 ||
        quantity > stock
      ){

        alert(
          "❌ " +
          item.title +
          " এর Stock পর্যাপ্ত নেই।"
        );

        return;

      }

    }


    /* ================= TOTAL ================= */

    let total = 0;


    cart.forEach(item=>{

      total +=
        Number(item.price || 0) *
        Number(item.quantity || 0);

    });


    orderBtn.disabled = true;

    orderBtn.textContent =
      "⏳ Order তৈরি হচ্ছে...";


    message.textContent = "";


    try{


      /* ================= ORDER DATA ================= */

      const orderData = {

        customer_name:
          customerName,

        customer_phone:
          phone,

        district:
          district,

        address:
          address,

        total:
          total,

        status:
          "pending"

      };


      /* ================= INSERT ORDER ================= */

      const {
        data,
        error
      } =
        await supabase
          .from("orders")
          .insert([
            orderData
          ])
          .select()
          .single();


      if(error){

        throw error;

      }


      /* ================= STOCK UPDATE ================= */

      for(
        const item of cart
      ){

        const newStock =
          Math.max(
            0,
            Number(item.stock || 0) -
            Number(item.quantity || 0)
          );


        await supabase
          .from("products")
          .update({
            stock:
              newStock
          })
          .eq(
            "id",
            item.id
          );

      }


      /* ================= CLEAR CART ================= */

      localStorage.removeItem(
        "cart"
      );


      cart = [];


      renderCart();


      message.style.color =
        "#19733f";


      message.innerHTML = `
        ✅ আপনার Order সফলভাবে নেওয়া হয়েছে।<br>
        Order ID:
        <b>${escapeHTML(
          String(data.id)
        )}</b>
      `;


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });


    }
    catch(error){

      console.error(error);


      message.style.color =
        "#c62828";


      message.textContent =
        "❌ Order করা যায়নি: " +
        error.message;


      orderBtn.disabled = false;

      orderBtn.textContent =
        "📦 Order Confirm করুন";

    }

  }
);


/* ================= ESCAPE ================= */

function escapeHTML(value){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* ================= START ================= */

renderCart();

</script>

</body>
</html>
