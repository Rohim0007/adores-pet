<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ADORE'S PET — Cart</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Arial,
    "Noto Sans Bengali",
    "Noto Sans",
    sans-serif;

  background:#f6f9f7;
  color:#10251d;
  line-height:1.5;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.site-header{
  width:100%;
  background:#fff;
  border-bottom:1px solid #dfe8e3;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  min-height:105px;
  margin:auto;
  padding:14px 24px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.brand-logo{
  display:flex;
  align-items:center;
  height:78px;
}

.brand-logo img{
  display:block;
  height:72px;
  width:auto;
  max-width:280px;
  object-fit:contain;
}

.home-btn{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  background:#19733f;
  color:#fff;

  padding:14px 25px;

  border-radius:18px;

  font-size:20px;
  font-weight:800;
}

.home-btn:hover{
  background:#145f34;
}


/* =====================================================
   MAIN
===================================================== */

main{
  min-height:calc(100vh - 300px);
}

.cart-section{
  max-width:1100px;
  margin:auto;
  padding:65px 20px 80px;
}


/* =====================================================
   TITLE
===================================================== */

.page-title{
  text-align:center;
  color:#19733f;

  font-size:48px;
  font-weight:800;

  margin-bottom:45px;
}

.page-title span{
  margin-right:10px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty-cart{
  background:#fff;

  border:1px solid #d9e3de;

  border-radius:25px;

  padding:70px 20px;

  text-align:center;

  box-shadow:
    0 5px 20px rgba(16,37,29,.05);
}

.empty-cart-icon{
  font-size:65px;
  margin-bottom:15px;
}

.empty-cart h2{
  font-size:28px;
  margin-bottom:12px;
}

.empty-cart p{
  color:#777;
  font-size:18px;
  margin-bottom:25px;
}

.shop-btn{
  display:inline-block;

  background:#19733f;
  color:#fff;

  padding:14px 25px;

  border-radius:12px;

  font-size:18px;
  font-weight:800;
}


/* =====================================================
   CART ITEM
===================================================== */

.cart-card{
  background:#fff;

  border:1px solid #d9e3de;

  border-radius:25px;

  padding:25px;

  margin-bottom:25px;

  box-shadow:
    0 5px 20px rgba(16,37,29,.05);
}

.cart-item{
  display:flex;

  gap:25px;

  padding:5px 0 25px;

  border-bottom:1px solid #ddd;
}

.cart-image-wrap{
  width:170px;
  height:170px;

  flex-shrink:0;

  border-radius:18px;

  overflow:hidden;

  background:#eee;
}

.cart-image{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.cart-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:55px;

  background:#eee;
}

.cart-info{
  flex:1;
  min-width:0;
}

.cart-title{
  font-size:28px;
  font-weight:800;

  margin-bottom:7px;

  word-break:break-word;
}

.cart-price{
  color:#19733f;

  font-size:25px;
  font-weight:800;

  margin-bottom:15px;
}


/* =====================================================
   QUANTITY
===================================================== */

.quantity-row{
  display:flex;
  align-items:center;

  gap:18px;

  margin-bottom:12px;
}

.qty-btn{
  width:58px;
  height:58px;

  border:0;

  border-radius:13px;

  background:#19733f;
  color:#fff;

  font-size:32px;
  font-weight:800;

  display:flex;
  align-items:center;
  justify-content:center;
}

.qty-btn:hover:not(:disabled){
  background:#145f34;
}

.qty-btn:disabled{
  background:#b8b8b8;
  cursor:not-allowed;
}

.qty-number{
  min-width:40px;

  text-align:center;

  font-size:25px;
  font-weight:800;
}

.stock-info{
  color:#777;
  font-size:17px;

  margin-bottom:12px;
}

.stock-limit{
  color:#d68910;
  font-weight:700;
}

.out-stock{
  color:#c62828;
  font-weight:800;
}


/* =====================================================
   SUBTOTAL
===================================================== */

.subtotal{
  font-size:23px;
  font-weight:800;

  margin-bottom:15px;
}


/* =====================================================
   REMOVE
===================================================== */

.remove-btn{
  border:0;

  background:#c62828;
  color:#fff;

  padding:11px 18px;

  border-radius:10px;

  font-size:16px;
  font-weight:800;
}

.remove-btn:hover{
  background:#a91f1f;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary{
  background:#eaf6ef;

  border-radius:22px;

  padding:28px;

  margin-top:25px;
}

.summary-row{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:20px;

  padding:10px 0;

  font-size:21px;
}

.summary-total{
  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:20px;

  border-top:1px solid #c7d9cf;

  margin-top:15px;
  padding-top:20px;

  color:#19733f;

  font-size:30px;
  font-weight:800;
}


/* =====================================================
   CHECKOUT
===================================================== */

.checkout{
  background:#fff;

  border:1px solid #d9e3de;

  border-radius:25px;

  padding:30px;

  margin-top:25px;

  box-shadow:
    0 5px 20px rgba(16,37,29,.05);
}

.checkout h2{
  color:#19733f;

  font-size:30px;

  margin-bottom:25px;
}

.form-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:18px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1 / -1;
}

.form-group label{
  font-weight:800;

  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;

  padding:14px;

  border:1px solid #ccc;

  border-radius:11px;

  font-size:17px;

  outline:none;

  background:#fff;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#19733f;

  box-shadow:
    0 0 0 3px rgba(25,115,63,.10);
}

.form-group textarea{
  min-height:120px;

  resize:vertical;
}


/* =====================================================
   ORDER BUTTON
===================================================== */

.order-btn{
  width:100%;

  border:0;

  background:#19733f;

  color:#fff;

  padding:17px 20px;

  border-radius:13px;

  margin-top:25px;

  font-size:21px;

  font-weight:800;
}

.order-btn:hover:not(:disabled){
  background:#145f34;
}

.order-btn:disabled{
  background:#999;
  cursor:not-allowed;
}

.message{
  margin-top:18px;

  font-size:17px;

  font-weight:700;

  text-align:center;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  text-align:center;

  padding:50px 20px;

  color:#777;

  font-size:20px;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  background:#06251a;

  color:#fff;

  padding:55px 24px 28px;

  text-align:center;
}

.footer-brand{
  font-size:30px;
  font-weight:800;

  margin-bottom:10px;
}

.footer-tagline{
  color:#b8c8c1;

  font-size:17px;

  margin-bottom:32px;
}

.footer-line{
  height:1px;

  background:rgba(255,255,255,.18);

  max-width:900px;

  margin:0 auto 22px;
}

.copyright{
  color:#9eafa8;

  font-size:14px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .header-inner{
    min-height:88px;

    padding:10px 16px;
  }

  .brand-logo{
    height:62px;
  }

  .brand-logo img{
    height:58px;
    max-width:180px;
  }

  .home-btn{
    padding:11px 17px;

    border-radius:15px;

    font-size:17px;
  }

  .cart-section{
    padding:45px 15px 60px;
  }

  .page-title{
    font-size:38px;

    margin-bottom:30px;
  }

  .cart-card{
    padding:18px;

    border-radius:20px;
  }

  .cart-item{
    gap:15px;
  }

  .cart-image-wrap{
    width:125px;
    height:125px;

    border-radius:15px;
  }

  .cart-title{
    font-size:21px;
  }

  .cart-price{
    font-size:21px;
  }

  .quantity-row{
    gap:10px;
  }

  .qty-btn{
    width:48px;
    height:48px;

    font-size:27px;
  }

  .qty-number{
    font-size:22px;
  }

  .stock-info{
    font-size:14px;
  }

  .subtotal{
    font-size:20px;
  }

  .summary{
    padding:22px;
  }

  .summary-row{
    font-size:18px;
  }

  .summary-total{
    font-size:25px;
  }

  .checkout{
    padding:22px;

    border-radius:20px;
  }

  .checkout h2{
    font-size:25px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .order-btn{
    font-size:18px;
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:420px){

  .brand-logo img{
    max-width:140px;
  }

  .home-btn{
    padding:9px 13px;

    font-size:15px;
  }

  .page-title{
    font-size:31px;
  }

  .cart-item{
    align-items:flex-start;
  }

  .cart-image-wrap{
    width:100px;
    height:100px;
  }

  .cart-title{
    font-size:18px;
  }

  .cart-price{
    font-size:19px;
  }

  .qty-btn{
    width:43px;
    height:43px;

    font-size:24px;
  }

  .qty-number{
    min-width:30px;

    font-size:20px;
  }

  .remove-btn{
    padding:9px 12px;

    font-size:14px;
  }

}

</style>

</head>

<script type="module">

import {
  createClient
} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   SUPABASE
===================================================== */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const cartContainer =
  document.getElementById(
    "cartContainer"
  );

const summaryBox =
  document.getElementById(
    "summaryBox"
  );

const summary =
  document.getElementById(
    "summary"
  );

const checkoutBox =
  document.getElementById(
    "checkoutBox"
  );

const orderBtn =
  document.getElementById(
    "orderBtn"
  );

const message =
  document.getElementById(
    "message"
  );


/* =====================================================
   CART
===================================================== */

let cart = [];


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value ?? "")

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =====================================================
   MONEY
===================================================== */

function money(value){

  return "৳" +
    Number(value || 0)
      .toLocaleString("en-US");

}


/* =====================================================
   LOAD CART
===================================================== */

function loadCart(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("cart") ||
        "[]"
      );


    cart =
      Array.isArray(saved)
        ? saved
        : [];


  }catch(error){

    console.error(
      "Cart read error:",
      error
    );

    cart = [];

  }

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}


/* =====================================================
   SYNC WITH SUPABASE
===================================================== */

async function syncCart(){

  if(!cart.length){

    return;

  }


  const {
    data,
    error
  } =
    await supabase
      .from("products")
      .select(
        "id,title,category,price,stock,image_url,description"
      );


  if(error){

    throw error;

  }


  const products =
    data || [];


  const synced = [];


  for(const item of cart){

    const itemId =
      item.id ??
      item.product_id;


    const product =
      products.find(
        p =>
          String(p.id) ===
          String(itemId)
      );


    if(!product){

      /*
        Product Database-এ না থাকলে
        Cart থেকে বাদ দেওয়া হবে।
      */

      continue;

    }


    const stock =
      Math.max(
        0,
        Number(product.stock || 0)
      );


    let quantity =
      Number(item.quantity);


    if(
      !Number.isFinite(quantity) ||
      quantity < 1
    ){

      quantity = 1;

    }


    /*
      Stock-এর বেশি quantity রাখা যাবে না।
    */

    if(stock > 0){

      quantity =
        Math.min(
          quantity,
          stock
        );

    }else{

      quantity = 0;

    }


    synced.push({

      id:
        product.id,

      title:
        product.title || "",

      category:
        product.category || "",

      price:
        Number(product.price || 0),

      stock:
        stock,

      image_url:
        product.image_url || "",

      description:
        product.description || "",

      quantity:
        quantity

    });

  }


  cart =
    synced;


  saveCart();

}


/* =====================================================
   EMPTY CART
===================================================== */

function showEmptyCart(){

  cartContainer.innerHTML = `

    <div class="empty-cart">

      <div class="empty-cart-icon">
        🛒
      </div>

      <h2>
        আপনার Cart খালি
      </h2>

      <p>
        পছন্দের Product Cart-এ যোগ করুন।
      </p>

      <a
        href="index.html"
        class="shop-btn"
      >
        🛍️ Shopping করুন
      </a>

    </div>

  `;


  summaryBox.style.display =
    "none";

  checkoutBox.style.display =
    "none";

}


/* =====================================================
   RENDER
===================================================== */

function renderCart(){

  if(!cart.length){

    showEmptyCart();

    return;

  }


  cartContainer.innerHTML = "";


  let total = 0;

  let quantityTotal = 0;


  cart.forEach(
    (item,index)=>{

      const price =
        Number(item.price || 0);

      const stock =
        Math.max(
          0,
          Number(item.stock || 0)
        );

      const quantity =
        Math.max(
          0,
          Number(item.quantity || 0)
        );


      const subtotal =
        price * quantity;


      total += subtotal;

      quantityTotal += quantity;


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "cart-card";


      let imageHTML;


      if(item.image_url){

        imageHTML = `

          <img
            class="cart-image"
            src="${escapeHTML(
              item.image_url
            )}"
            alt="${escapeHTML(
              item.title
            )}"

            onerror="
              this.style.display='none';
              this.nextElementSibling.style.display='flex';
            "
          >

          <div
            class="cart-placeholder"
            style="display:none;"
          >
            🐰
          </div>

        `;

      }else{

        imageHTML = `

          <div class="cart-placeholder">
            🐰
          </div>

        `;

      }


      let stockMessage = "";


      if(stock <= 0){

        stockMessage = `

          <span class="out-stock">
            ❌ বর্তমানে Stock নেই
          </span>

        `;

      }
      else if(quantity >= stock){

        stockMessage = `

          <span class="stock-limit">
            ⚠️ Stock limit reached
          </span>

        `;

      }


      card.innerHTML = `

        <div class="cart-item">


          <!-- IMAGE -->

          <div class="cart-image-wrap">

            ${imageHTML}

          </div>


          <!-- INFO -->

          <div class="cart-info">


            <div class="cart-title">

              ${escapeHTML(
                item.title
              )}

            </div>


            <div class="cart-price">

              ${money(price)}

            </div>


            <!-- QUANTITY -->

            <div class="quantity-row">

              <button
                type="button"
                class="qty-btn minus-btn"
                data-index="${index}"

                ${
                  quantity <= 1
                    ? "disabled"
                    : ""
                }
              >
                −
              </button>


              <span class="qty-number">

                ${quantity}

              </span>


              <button
                type="button"
                class="qty-btn plus-btn"
                data-index="${index}"

                ${
                  quantity >= stock ||
                  stock <= 0
                    ? "disabled"
                    : ""
                }
              >
                +
              </button>

            </div>


            <!-- STOCK -->

            <div class="stock-info">

              Available Stock:
              <b>${stock}</b>

              <br>

              ${stockMessage}

            </div>


            <!-- SUBTOTAL -->

            <div class="subtotal">

              ${money(subtotal)}

            </div>


            <!-- REMOVE -->

            <button
              type="button"
              class="remove-btn"
              data-index="${index}"
            >

              🗑️ Remove

            </button>


          </div>


        </div>

      `;


      cartContainer.appendChild(
        card
      );

    }
  );


  /* ===================================================
     SUMMARY
  =================================================== */

  summary.innerHTML = `

    <div class="summary-row">

      <span>
        মোট Product
      </span>

      <b>
        ${cart.length}
      </b>

    </div>


    <div class="summary-row">

      <span>
        মোট Quantity
      </span>

      <b>
        ${quantityTotal}
      </b>

    </div>


    <div class="summary-total">

      <span>
        সর্বমোট
      </span>

      <span>
        ${money(total)}
      </span>

    </div>

  `;


  summaryBox.style.display =
    "block";

  checkoutBox.style.display =
    "block";


  /* ===================================================
     MINUS
  =================================================== */

  document
    .querySelectorAll(".minus-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const index =
            Number(
              button.dataset.index
            );


          const current =
            Number(
              cart[index].quantity || 0
            );


          if(current <= 1){

            return;

          }


          cart[index].quantity =
            current - 1;


          saveCart();

          renderCart();

        }
      );

    });


  /* ===================================================
     PLUS
  =================================================== */

  document
    .querySelectorAll(".plus-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const index =
            Number(
              button.dataset.index
            );


          const current =
            Number(
              cart[index].quantity || 0
            );


          const stock =
            Number(
              cart[index].stock || 0
            );


          if(stock <= 0){

            alert(
              "❌ এই Product বর্তমানে Stock-এ নেই।"
            );

            return;

          }


          if(current >= stock){

            alert(
              "❌ Stock মাত্র " +
              stock +
              " টি। এর বেশি Order করা যাবে না।"
            );

            return;

          }


          cart[index].quantity =
            current + 1;


          saveCart();

          renderCart();

        }
      );

    });


  /* ===================================================
     REMOVE
  =================================================== */

  document
    .querySelectorAll(".remove-btn")
    .forEach(button=>{

      button.addEventListener(
        "click",
        ()=>{

          const index =
            Number(
              button.dataset.index
            );


          cart.splice(
            index,
            1
          );


          saveCart();

          renderCart();

        }
      );

    });

}


/* =====================================================
   VALIDATE PHONE
===================================================== */

function validPhone(phone){

  const clean =
    phone
      .replace(/\s+/g,"")
      .replace(/-/g,"");


  return /^01[3-9]\d{8}$/.test(
    clean
  );

}


/* =====================================================
   ORDER
===================================================== */

orderBtn.addEventListener(
  "click",
  async ()=>{


    message.textContent = "";


    if(!cart.length){

      message.style.color =
        "#c62828";

      message.textContent =
        "❌ Cart খালি।";

      return;

    }


    const name =
      document
        .getElementById(
          "customerName"
        )
        .value
        .trim();


    const phone =
      document
        .getElementById(
          "customerPhone"
        )
        .value
        .trim();


    const district =
      document
        .getElementById(
          "district"
        )
        .value
        .trim();


    const address =
      document
        .getElementById(
          "address"
        )
        .value
        .trim();


    /* =================================================
       REQUIRED
    ================================================= */

    if(
      !name ||
      !phone ||
      !district ||
      !address
    ){

      message.style.color =
        "#c62828";

      message.textContent =
        "❌ দয়া করে সব তথ্য পূরণ করুন।";

      return;

    }


    /* =================================================
       PHONE
    ================================================= */

    const cleanPhone =
      phone
        .replace(/\s+/g,"")
        .replace(/-/g,"");


    if(
      !validPhone(
        cleanPhone
      )
    ){

      message.style.color =
        "#c62828";

      message.textContent =
        "❌ সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।";

      return;

    }


    /* =================================================
       FINAL STOCK CHECK
    ================================================= */

    try{

      const ids =
        cart.map(
          item => item.id
        );


      const {
        data: latestProducts,
        error: stockLoadError
      } =
        await supabase
          .from("products")
          .select(
            "id,title,price,stock,image_url"
          )
          .in(
            "id",
            ids
          );


      if(stockLoadError){

        throw stockLoadError;

      }


      for(
        const item of cart
      ){

        const product =
          latestProducts.find(
            p =>
              String(p.id) ===
              String(item.id)
          );


        if(!product){

          throw new Error(
            item.title +
            " আর পাওয়া যাচ্ছে না।"
          );

        }


        const currentStock =
          Number(
            product.stock || 0
          );


        const requested =
          Number(
            item.quantity || 0
          );


        if(
          currentStock <= 0
        ){

          throw new Error(
            item.title +
            " বর্তমানে Stock-এ নেই।"
          );

        }


        if(
          requested > currentStock
        ){

          throw new Error(
            item.title +
            " এর Stock মাত্র " +
            currentStock +
            " টি।"
          );

        }

      }


      /* =================================================
         TOTAL
      ================================================= */

      let total = 0;


      cart.forEach(item=>{

        total +=
          Number(
            item.price || 0
          ) *
          Number(
            item.quantity || 0
          );

      });


      /* =================================================
         BUTTON
      ================================================= */

      orderBtn.disabled =
        true;

      orderBtn.textContent =
        "⏳ Order নেওয়া হচ্ছে...";


      /* =================================================
         ORDER DATA
      ================================================= */

      const orderData = {

        customer_name:
          name,

        customer_phone:
          cleanPhone,

        district:
          district,

        address:
          address,

        total:
          total,

        status:
          "pending"

      };


      /* =================================================
         INSERT ORDER
      ================================================= */

      const {
        data: order,
        error: orderError
      } =
        await supabase
          .from("orders")
          .insert([
            orderData
          ])
          .select()
          .single();


      if(orderError){

        throw orderError;

      }


      /* =================================================
         UPDATE STOCK
      ================================================= */

      for(
        const item of cart
      ){

        const product =
          latestProducts.find(
            p =>
              String(p.id) ===
              String(item.id)
          );


        const oldStock =
          Number(
            product.stock || 0
          );


        const quantity =
          Number(
            item.quantity || 0
          );


        const newStock =
          Math.max(
            0,
            oldStock - quantity
          );


        const {
          error: updateError
        } =
          await supabase
            .from("products")
            .update({

              stock:
                newStock

            })
            .eq(
              "id",
              product.id
            );


        if(updateError){

          console.error(
            "Stock update error:",
            updateError
          );

        }

      }


      /* =================================================
         CLEAR CART
      ================================================= */

      cart = [];


      localStorage.removeItem(
        "cart"
      );


      renderCart();


      /* =================================================
         SUCCESS
      ================================================= */

      message.style.color =
        "#19733f";


      message.innerHTML = `

        ✅ <b>আপনার Order সফলভাবে নেওয়া হয়েছে!</b>

        <br><br>

        Order ID:
        <b>
          ${escapeHTML(
            String(order.id)
          )}
        </b>

        <br>

        মোট:
        <b>
          ${money(total)}
        </b>

        <br><br>

        আমাদের পক্ষ থেকে আপনার সাথে যোগাযোগ করা হবে।

      `;


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });


    }
    catch(error){

      console.error(
        "ORDER ERROR:",
        error
      );


      message.style.color =
        "#c62828";


      message.textContent =
        "❌ Order করা যায়নি: " +
        (
          error.message ||
          "অজানা সমস্যা"
        );


      orderBtn.disabled =
        false;


      orderBtn.textContent =
        "📦 Order Confirm করুন";

    }

  }
);


/* =====================================================
   START
===================================================== */

async function start(){

  try{

    loadCart();


    if(!cart.length){

      showEmptyCart();

      return;

    }


    await syncCart();


    renderCart();

  }
  catch(error){

    console.error(
      "CART ERROR:",
      error
    );


    cartContainer.innerHTML = `

      <div class="empty-cart">

        <div class="empty-cart-icon">
          ⚠️
        </div>

        <h2>
          Cart লোড করতে সমস্যা হয়েছে
        </h2>

        <p>
          ${escapeHTML(
            error.message ||
            "অনুগ্রহ করে আবার চেষ্টা করুন।"
          )}
        </p>

        <button
          class="shop-btn"
          onclick="location.reload()"
        >
          🔄 আবার চেষ্টা করুন
        </button>

      </div>

    `;

  }

}


start();

</script>
