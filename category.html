<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ADORE'S PET - Products</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Bengali",sans-serif;
    background:#f4f9f6;
    color:#092d22;
}

/* HEADER */

.header{
    height:105px;
    background:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    border-bottom:1px solid #ddd;

    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    width:75px;
    cursor:pointer;
}

.cart-btn{
    background:#177b45;
    color:#fff;
    border:0;
    border-radius:35px;

    height:64px;
    min-width:235px;

    padding:0 15px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;
}

.cart-count{
    background:#fff;
    color:#177b45;

    width:48px;
    height:48px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* MAIN */

.main{
    padding:45px 5% 110px;
}

.back{
    color:#177b45;
    font-weight:bold;
    cursor:pointer;
    font-size:17px;
}

.title{
    text-align:center;
    color:#197647;
    font-size:32px;
    margin:30px 0 40px;
}

/* PRODUCTS */

.products{
    max-width:900px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:25px;
}

.product{
    background:#fff;

    border:2px solid #dce4e0;

    border-radius:25px;

    padding:15px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.05);
}

.product img{
    width:100%;
    height:260px;

    object-fit:contain;

    background:#f7f7f7;

    border-radius:18px;
}

.product h3{
    font-size:22px;
    margin:15px 5px 5px;
}

.category{
    font-size:13px;
    color:#777;
}

.price{
    font-size:24px;
    font-weight:bold;
    color:#177b45;
    margin:10px 5px;
}

.stock{
    font-size:14px;
    font-weight:bold;
    margin:5px;
}

.available{
    color:#177b45;
}

.out{
    color:#e53935;
}

.buy{
    width:100%;

    border:0;

    background:#177b45;
    color:#fff;

    padding:13px;

    border-radius:10px;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.buy:disabled{
    background:#aaa;
}

/* EMPTY */

.empty{
    grid-column:1/-1;

    background:#fff;

    border-radius:20px;

    padding:60px 20px;

    text-align:center;

    color:#777;
}

/* CART */

.cart{
    display:none;

    max-width:700px;

    margin:40px auto 0;

    background:#fff;

    padding:20px;

    border-radius:25px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.08);
}

.cart-item{
    display:flex;
    align-items:center;

    gap:12px;

    background:#f4f7f5;

    padding:10px;

    border-radius:12px;

    margin-bottom:10px;
}

.cart-item img{
    width:65px;
    height:65px;

    object-fit:contain;

    background:#fff;

    border-radius:10px;
}

.cart-info{
    flex:1;
}

.qty{
    display:flex;
    align-items:center;
    gap:6px;

    margin-top:7px;
}

.qty button{
    border:0;

    width:30px;
    height:30px;

    background:#177b45;
    color:#fff;

    border-radius:6px;

    cursor:pointer;
}

.qty .remove{
    background:#e53935;
}

.input{
    width:100%;

    padding:12px;

    margin-top:8px;

    border:1px solid #ccc;

    border-radius:9px;
}

.delivery{
    margin-top:12px;

    padding:12px;

    background:#fff4cf;

    border-radius:10px;

    font-weight:bold;
}

.total{
    font-size:24px;

    color:#177b45;

    font-weight:bold;

    margin:12px 0;
}

.order{
    width:100%;

    padding:14px;

    border:0;

    border-radius:10px;

    background:#177b45;

    color:#fff;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

/* FOOTER */

.footer{
    background:#002c20;

    color:#fff;

    text-align:center;

    padding:60px 20px 30px;
}

.footer-logo{
    font-size:38px;
    font-weight:bold;
}

.footer-tagline{
    color:#b7c9c3;
    margin-top:15px;
}

@media(max-width:600px){

    .header{
        padding:0 25px;
    }

    .cart-btn{
        min-width:190px;
        font-size:18px;
    }

    .products{
        grid-template-columns:1fr;
    }

    .main{
        padding-left:20px;
        padding-right:20px;
    }

    .product img{
        height:240px;
    }

}

</style>

</head>


<body>


<header class="header">

<img
src="logo.png"
class="logo"
onclick="location.href='index.html'"
alt="ADORE'S PET"
>


<button
class="cart-btn"
onclick="toggleCart()"
>

<span>🛒 Cart</span>

<span
class="cart-count"
id="cartCount"
>
0
</span>

</button>

</header>


<main class="main">

<div
class="back"
onclick="location.href='index.html'"
>
← Home
</div>


<h1
class="title"
id="categoryTitle"
>
Products
</h1>


<div
class="products"
id="products"
>
</div>


<!-- CART -->

<div
class="cart"
id="cart"
>

<h2>
🛒 Your Cart
</h2>

<div id="cartItems"></div>


<select
class="input"
id="area"
onchange="calculateTotal()"
>

<option value="">
Delivery Area নির্বাচন করুন
</option>

<option value="inside">
ঢাকার ভিতরে
</option>

<option value="outside">
ঢাকার বাইরে
</option>

</select>


<input
class="input"
id="name"
placeholder="আপনার নাম"
>


<input
class="input"
id="phone"
placeholder="মোবাইল নাম্বার"
>


<input
class="input"
id="address"
placeholder="সম্পূর্ণ ঠিকানা"
>


<div
class="delivery"
id="delivery"
>
🚚 Delivery Area নির্বাচন করুন
</div>


<div
class="total"
id="total"
>
মোট: 0৳
</div>


<button
class="order"
onclick="placeOrder()"
>
🚀 অর্ডার করুন
</button>

</div>

</main>


<footer class="footer">

<div class="footer-logo">
🐰 ADORE'S PET
</div>

<div class="footer-tagline">
আপনার বিশ্বস্ত Pet Shop
</div>

</footer>


<script>

emailjs.init(
"P7lqeBS7YKyU3Kpaq"
);


const PRODUCT_KEY=
"adores_pet_products_v5";

const CART_KEY=
"adores_pet_cart_v5";


let products=
JSON.parse(
localStorage.getItem(PRODUCT_KEY)||"[]"
);

let cart=
JSON.parse(
localStorage.getItem(CART_KEY)||"[]"
);


const params=
new URLSearchParams(
location.search
);

const category=
params.get("category");


document
.getElementById("categoryTitle")
.textContent=
category || "Products";


function saveProducts(){

localStorage.setItem(
PRODUCT_KEY,
JSON.stringify(products)
);

}


function saveCart(){

localStorage.setItem(
CART_KEY,
JSON.stringify(cart)
);

}


function escapeHTML(value){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* PRODUCTS */

function renderProducts(){

const box=
document.getElementById(
"products"
);

box.innerHTML="";


const filtered=
category
?
products.filter(
p=>p.category===category
)
:
products;


if(!filtered.length){

box.innerHTML=`

<div class="empty">

📦 এই Category-তে বর্তমানে
কোনো Product নেই।

</div>

`;

return;

}


filtered.forEach(
p=>{

const div=
document.createElement("div");

div.className="product";


div.innerHTML=`

<img
src="${escapeHTML(p.image)}"
alt="${escapeHTML(p.name)}"
>

<h3>
${escapeHTML(p.name)}
</h3>

<div class="category">
${escapeHTML(p.category)}
</div>

<div class="price">
${Number(p.price)}৳
</div>

<div
class="stock ${
p.stock>0
?
"available"
:
"out"
}"
>

${
p.stock>0
?
"📦 Stock: "+p.stock
:
"❌ Out of Stock"
}

</div>

<button
class="buy"
${p.stock<=0?"disabled":""}
onclick="addToCart('${p.id}')"
>

${
p.stock>0
?
"🛒 Add to Cart"
:
"Out of Stock"
}

</button>

`;

box.appendChild(div);

});

}


/* ADD CART */

function addToCart(id){

const p=
products.find(
x=>x.id===id
);

if(!p || p.stock<=0)
return;


const item=
cart.find(
x=>x.id===id
);


if(item){

if(
item.qty>=p.stock
){

alert(
"⚠️ Stock শেষ"
);

return;

}

item.qty++;

}else{

cart.push({
id:id,
qty:1
});

}


saveCart();

updateCart();

alert(
"✅ Cart-এ যোগ হয়েছে"
);

}


/* CART */

function updateCart(){

document
.getElementById("cartCount")
.textContent=
cart.reduce(
(a,b)=>a+b.qty,
0
);

renderCart();

}


function renderCart(){

const box=
document.getElementById(
"cartItems"
);

box.innerHTML="";


cart.forEach(
(item,index)=>{

const p=
products.find(
x=>x.id===item.id
);

if(!p)
return;


const div=
document.createElement("div");

div.className="cart-item";


div.innerHTML=`

<img
src="${escapeHTML(p.image)}"
>

<div class="cart-info">

<b>
${escapeHTML(p.name)}
</b>

<br>

${p.price}৳ × ${item.qty}

<div class="qty">

<button
onclick="changeQty(${index},1)"
>
+
</button>

<span>
${item.qty}
</span>

<button
onclick="changeQty(${index},-1)"
>
−
</button>

<button
class="remove"
onclick="removeItem(${index})"
>
×
</button>

</div>

</div>

`;

box.appendChild(div);

});


calculateTotal();

}


function changeQty(index,value){

const item=
cart[index];

if(!item)
return;


const p=
products.find(
x=>x.id===item.id
);

if(!p)
return;


if(
value>0 &&
item.qty>=p.stock
){

alert("⚠️ Stock শেষ");

return;

}


item.qty+=value;


if(item.qty<=0){

cart.splice(index,1);

}


saveCart();

updateCart();

}


function removeItem(index){

cart.splice(index,1);

saveCart();

updateCart();

}


function toggleCart(){

const box=
document.getElementById("cart");


box.style.display=
box.style.display==="block"
?
"none"
:
"block";


if(box.style.display==="block"){

box.scrollIntoView({
behavior:"smooth"
});

}

}


/* DELIVERY */

function deliveryCharge(){

const area=
document.getElementById("area")
.value;


if(!area)
return 0;


const cats=
cart.map(
item=>{

const p=
products.find(
x=>x.id===item.id
);

return p?.category;

});


/*
Rabbit = Highest Priority
Hamster = Second
Food/Accessories = Third
*/

if(
cats.includes("Rabbit")
){

return area==="inside"
?
300
:
600;

}


if(
cats.includes("Hamster")
){

return area==="inside"
?
300
:
400;

}


if(
cats.includes("Pet Food") ||
cats.includes("Accessories")
){

return area==="inside"
?
70
:
130;

}


return 0;

}


/* TOTAL */

function calculateTotal(){

let subtotal=0;


cart.forEach(
item=>{

const p=
products.find(
x=>x.id===item.id
);

if(p){

subtotal+=
p.price*item.qty;

}

});


const delivery=
deliveryCharge();


document
.getElementById("delivery")
.textContent=
delivery
?
"🚚 Delivery Charge: "+
delivery+"৳"
:
"🚚 Delivery Area নির্বাচন করুন";


document
.getElementById("total")
.textContent=
"মোট: "+
(subtotal+delivery)+
"৳";

}


/* ORDER */

function placeOrder(){

if(!cart.length){

alert(
"❌ Cart Empty"
);

return;

}


const name=
document
.getElementById("name")
.value.trim();


const phone=
document
.getElementById("phone")
.value.trim();


const address=
document
.getElementById("address")
.value.trim();


const area=
document
.getElementById("area")
.value;


if(
!name ||
!phone ||
!address ||
!area
){

alert(
"❌ সব তথ্য পূরণ করুন"
);

return;

}


/* STOCK CHECK */

for(
const item of cart
){

const p=
products.find(
x=>x.id===item.id
);


if(
!p ||
p.stock<item.qty
){

alert(
"❌ "+
(p?.name||"Product")+
" এর পর্যাপ্ত Stock নেই"
);

return;

}

}


let subtotal=0;

let productText="";


cart.forEach(
item=>{

const p=
products.find(
x=>x.id===item.id
);

subtotal+=
p.price*item.qty;


productText+=
`${p.name} × ${item.qty} = ${p.price*item.qty}৳ [${p.category}]\n`;

});


const delivery=
deliveryCharge();


const total=
subtotal+delivery;


const templateParams={

customer_name:name,

customer_phone:phone,

customer_address:address,

delivery_area:
area==="inside"
?
"ঢাকার ভিতরে"
:
"ঢাকার বাইরে",

products:productText,

subtotal:subtotal,

delivery_charge:delivery,

total:total

};


emailjs.send(

"service_5am5end",

"template_45wz8f9",

templateParams

)

.then(
()=>{

/* সফল Order-এর পর Stock কমবে */

cart.forEach(
item=>{

const p=
products.find(
x=>x.id===item.id
);

if(p){

p.stock=
Math.max(
0,
p.stock-item.qty
);

}

});


saveProducts();


cart=[];

saveCart();

updateCart();

renderProducts();


document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("address").value="";
document.getElementById("area").value="";


alert(
"✅ Order সফলভাবে পাঠানো হয়েছে"
);

}

)

.catch(
error=>{

console.error(error);

alert(
"❌ Order পাঠানো যায়নি"
);

}

);

}


/* START */

renderProducts();

updateCart();


if(
params.get("cart")==="1"
){

setTimeout(
toggleCart,
300
);

}

</script>

</body>
</html>
