<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADORE'S PET</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f6f9f7;
  color:#10251d;
}

a{
  text-decoration:none;
  color:inherit;
}


/* ================= HEADER ================= */

.site-header{
  background:#fff;
  border-bottom:1px solid #dfe8e3;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  min-height:90px;
  margin:auto;
  padding:10px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo img{
  height:65px;
  width:auto;
  max-width:230px;
  object-fit:contain;
  display:block;
}

.cart-btn{
  display:flex;
  align-items:center;
  gap:8px;

  background:#19733f;
  color:#fff;

  padding:8px 12px;
  border-radius:22px;

  font-size:18px;
  font-weight:700;
}

.cart-count{
  width:44px;
  height:44px;

  background:#fff;
  color:#19733f;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}


/* ================= MAIN ================= */

main{
  max-width:1200px;
  margin:auto;
  padding:35px 18px 70px;
}

.back-btn{
  display:inline-block;

  background:#19733f;
  color:#fff;

  padding:11px 20px;
  border-radius:10px;

  font-weight:700;

  margin-bottom:30px;
}

.page-title{
  text-align:center;

  color:#19733f;

  font-size:38px;

  font-weight:800;

  margin-bottom:40px;
}


/* ================= PRODUCT GRID ================= */

.product-grid{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:25px;

}


/* ================= PRODUCT CARD ================= */

.product-card{

  background:#fff;

  border:1px solid #d9e3de;

  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0 5px 18px rgba(16,37,29,.06);

}


.product-image{

  width:100%;

  aspect-ratio:1/1;

  object-fit:cover;

  display:block;

  background:#eee;

}


.product-body{

  padding:18px;

}


.product-title{

  font-size:24px;

  font-weight:800;

  margin-bottom:7px;

  word-break:break-word;

}


.product-category{

  color:#777;

  font-size:14px;

  margin-bottom:8px;

}


.product-price{

  color:#19733f;

  font-size:25px;

  font-weight:800;

  margin-bottom:6px;

}


.product-stock{

  color:#666;

  font-size:14px;

  margin-bottom:16px;

}


/* ================= ADD TO CART ================= */

.add-cart-btn{

  width:100%;

  border:0;

  background:#19733f;

  color:#fff;

  padding:13px;

  border-radius:10px;

  font-size:17px;

  font-weight:800;

  cursor:pointer;

}


.add-cart-btn:hover{

  background:#145d34;

}


.add-cart-btn:disabled{

  background:#999;

  cursor:not-allowed;

}


/* ================= MESSAGE ================= */

.message{

  grid-column:1 / -1;

  text-align:center;

  padding:60px 15px;

  color:#777;

  font-size:19px;

}


.error{

  color:#c62828;

}


/* ================= TOAST ================= */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:translateX(-50%);

  background:#19733f;

  color:#fff;

  padding:13px 20px;

  border-radius:10px;

  font-weight:700;

  display:none;

  z-index:9999;

}


/* ================= FOOTER ================= */

footer{

  background:#06251a;

  color:#fff;

  text-align:center;

  padding:45px 20px 25px;

}

.footer-brand{

  font-size:28px;

  font-weight:800;

  margin-bottom:8px;

}

.footer-text{

  color:#b8c8c1;

  margin-bottom:25px;

}

.footer-line{

  height:1px;

  background:rgba(255,255,255,.18);

  max-width:900px;

  margin:0 auto 20px;

}

.copyright{

  color:#9eafa8;

  font-size:14px;

}


/* ================= MOBILE ================= */

@media(max-width:700px){

  .header-inner{

    min-height:82px;

    padding:8px 12px;

  }

  .logo img{

    height:55px;

    max-width:170px;

  }

  .cart-btn{

    font-size:15px;

    padding:6px 8px;

  }

  .cart-count{

    width:40px;

    height:40px;

    font-size:17px;

  }

  main{

    padding:25px 12px 50px;

  }

  .page-title{

    font-size:30px;

    margin-bottom:30px;

  }

  .product-grid{

    grid-template-columns:1fr 1fr;

    gap:12px;

  }

  .product-card{

    border-radius:17px;

  }

  .product-body{

    padding:11px;

  }

  .product-title{

    font-size:17px;

  }

  .product-category{

    font-size:12px;

  }

  .product-price{

    font-size:19px;

  }

  .product-stock{

    font-size:12px;

    margin-bottom:11px;

  }

  .add-cart-btn{

    font-size:13px;

    padding:10px 5px;

  }

}


/* ================= VERY SMALL ================= */

@media(max-width:380px){

  .logo img{

    max-width:145px;

  }

  .cart-btn{

    font-size:13px;

  }

  .cart-count{

    width:36px;

    height:36px;

  }

  .product-title{

    font-size:15px;

  }

  .product-price{

    font-size:17px;

  }

  .add-cart-btn{

    font-size:12px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

  <div class="header-inner">


    <a
      href="index.html"
      class="logo"
    >

      <img
        src="logo.png.png"
        alt="ADORE'S PET"
      >

    </a>


    <a
      href="cart.html"
      class="cart-btn"
    >

      🛒 Cart

      <span
        id="cartCount"
        class="cart-count"
      >
        0
      </span>

    </a>


  </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


  <a
    href="index.html"
    class="back-btn"
  >
    ← Home
  </a>


  <h1
    id="pageTitle"
    class="page-title"
  >
    Products
  </h1>


  <div
    id="productGrid"
    class="product-grid"
  >

    <div class="message">

      ⏳ Product লোড হচ্ছে...

    </div>

  </div>


</main>



<!-- =====================================================
     TOAST
===================================================== -->

<div
  id="toast"
  class="toast"
></div>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div class="footer-brand">
    🐰 ADORE'S PET
  </div>

  <div class="footer-text">
    আপনার বিশ্বস্ত Pet Shop
  </div>

  <div class="footer-line"></div>

  <div class="copyright">
    © 2026 ADORE'S PET — All Rights Reserved
  </div>

</footer>



<!-- =====================================================
     CONFIG
===================================================== -->

<script src="config.js"></script>



<!-- =====================================================
     CATEGORY + CART
===================================================== -->

<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   SUPABASE
===================================================== */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const productGrid =
  document.getElementById(
    "productGrid"
  );

const pageTitle =
  document.getElementById(
    "pageTitle"
  );

const cartCount =
  document.getElementById(
    "cartCount"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   CATEGORY
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const selectedCategory =
  (
    params.get("category")
    || ""
  )
  .trim();


pageTitle.textContent =
  selectedCategory
  || "All Products";


/* =====================================================
   CART
===================================================== */

function getCart(){

  try{

    const data =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    return [];

  }

}


function saveCart(cart){

  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );

}


function updateCartCount(){

  const cart =
    getCart();


  const count =
    cart.reduce(
      (
        total,
        item
      ) => {

        return total +
          (
            Number(
              item.quantity
            ) || 1
          );

      },
      0
    );


  cartCount.textContent =
    count;

}


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  toast.textContent =
    text;

  toast.style.display =
    "block";


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      function(){

        toast.style.display =
          "none";

      },
      1800
    );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(product){

  try{

    const cart =
      getCart();


    const productId =
      String(
        product.id
      );


    const existing =
      cart.find(
        function(item){

          return String(
            item.id
          ) === productId;

        }
      );


    if(existing){

      existing.quantity =
        (
          Number(
            existing.quantity
          ) || 1
        ) + 1;

    }else{

      cart.push({

        id:
          product.id,

        title:
          product.title || "Product",

        price:
          Number(
            product.price
          ) || 0,

        image:
          product.image_url || "",

        quantity:
          1

      });

    }


    saveCart(
      cart
    );


    updateCartCount();


    showToast(
      "✅ Cart-এ Product যোগ হয়েছে"
    );


  }catch(error){

    console.error(
      "CART ERROR:",
      error
    );


    showToast(
      "❌ Cart-এ যোগ করা যায়নি"
    );

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
  products
){

  if(
    !products.length
  ){

    productGrid.innerHTML = `

      <div
        class="message"
      >

        📦 এই Category-তে
        কোনো Product নেই।

      </div>

    `;

    return;

  }


  productGrid.innerHTML =
    "";


  products.forEach(
    function(product){

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "product-card";


      const title =
        product.title
        || "Product";


      const category =
        product.category
        || "";


      const price =
        Number(
          product.price
        ) || 0;


      const stock =
        Number(
          product.stock
        ) || 0;


      const image =
        product.image_url
        ||
        "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f430.svg";


      card.innerHTML = `

        <img
          class="product-image"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(title)}"
          loading="lazy"
          onerror="
            this.src='https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f430.svg'
          "
        >


        <div
          class="product-body"
        >

          <div
            class="product-title"
          >
            ${escapeHTML(title)}
          </div>


          <div
            class="product-category"
          >

            Category:
            ${escapeHTML(category)}

          </div>


          <div
            class="product-price"
          >

            ৳${price.toLocaleString("en-BD")}

          </div>


          <div
            class="product-stock"
          >

            Stock:
            ${stock}

          </div>


          <button
            type="button"
            class="add-cart-btn"
          >

            ${
              stock > 0
              ? "🛒 Add to Cart"
              : "Out of Stock"
            }

          </button>

        </div>

      `;


      const button =
        card.querySelector(
          ".add-cart-btn"
        );


      if(
        stock <= 0
      ){

        button.disabled =
          true;

      }else{

        button.addEventListener(
          "click",
          function(){

            addToCart(
              product
            );

          }
        );

      }


      productGrid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  productGrid.innerHTML = `

    <div
      class="message"
    >

      ⏳ Product লোড হচ্ছে...

    </div>

  `;


  try{


    const result =
      await supabase
        .from("products")
        .select("*")
        .order(
          "id",
          {
            ascending:false
          }
        );


    const data =
      result.data;


    const error =
      result.error;


    if(error){

      throw error;

    }


    let products =
      data || [];


    /* CATEGORY FILTER */

    if(
      selectedCategory
    ){

      const wanted =
        selectedCategory
          .toLowerCase()
          .trim();


      products =
        products.filter(
          function(product){

            const category =
              String(
                product.category
                || ""
              )
              .toLowerCase()
              .trim();


            return (
              category === wanted
              ||
              category.includes(
                wanted
              )
            );

          }
        );

    }


    renderProducts(
      products
    );


  }catch(error){

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );


    productGrid.innerHTML = `

      <div
        class="message error"
      >

        ❌ Product লোড করা যায়নি।

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

updateCartCount();

loadProducts();

</script>


</body>

</html>
