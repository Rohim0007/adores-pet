<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADORE'S PET — Products</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f6f9f7;
  color:#10251d;
}

a{
  text-decoration:none;
  color:inherit;
}


/* ================= HEADER ================= */

header{
  background:#fff;
  border-bottom:1px solid #dfe8e3;
  position:sticky;
  top:0;
  z-index:1000;
}

.header{
  max-width:1200px;
  min-height:90px;
  margin:auto;
  padding:10px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo img{
  height:62px;
  width:auto;
  max-width:220px;
  object-fit:contain;
  display:block;
}

.cart{
  background:#19733f;
  color:white;
  border-radius:22px;
  padding:8px 12px;

  display:flex;
  align-items:center;
  gap:8px;

  font-size:18px;
  font-weight:700;
}

.cart-count{
  width:44px;
  height:44px;
  background:white;
  color:#19733f;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:800;
}


/* ================= MAIN ================= */

main{
  max-width:1200px;
  margin:auto;
  padding:30px 18px 60px;
}

.back{
  display:inline-block;
  background:#19733f;
  color:white;
  padding:10px 18px;
  border-radius:10px;
  font-weight:700;
  margin-bottom:25px;
}

.title{
  text-align:center;
  color:#19733f;
  font-size:30px;
  font-weight:800;
  margin-bottom:30px;
}


/* ================= GRID ================= */

.product-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:20px;
}


/* ================= CARD ================= */

.product-card{
  background:white;
  border:1px solid #d9e3de;
  border-radius:18px;
  overflow:hidden;

  box-shadow:
    0 5px 18px rgba(16,37,29,.06);
}

.product-card img{
  width:100%;
  height:230px;
  object-fit:cover;
  display:block;
  background:#eee;
}

.product-body{
  padding:16px;
}

.product-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:7px;
}

.category{
  color:#777;
  font-size:14px;
  margin-bottom:7px;
}

.price{
  color:#19733f;
  font-size:22px;
  font-weight:800;
  margin-bottom:5px;
}

.stock{
  color:#666;
  font-size:14px;
  margin-bottom:14px;
}

.add{
  width:100%;
  border:0;
  background:#19733f;
  color:white;

  padding:11px;
  border-radius:9px;

  font-size:15px;
  font-weight:700;

  cursor:pointer;
}

.add:disabled{
  background:#999;
  cursor:not-allowed;
}


/* ================= MESSAGE ================= */

.message{
  text-align:center;
  padding:50px 15px;
  color:#777;
  font-size:18px;
}

.error{
  color:#c62828;
}


/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  background:#19733f;
  color:white;

  padding:12px 20px;

  border-radius:10px;

  font-weight:700;

  display:none;

  z-index:9999;
}


/* ================= FOOTER ================= */

footer{
  background:#06251a;
  color:white;
  text-align:center;

  padding:45px 20px 25px;
}

.footer-title{
  font-size:28px;
  font-weight:800;
  margin-bottom:8px;
}

.footer-text{
  color:#b8c8c1;
  margin-bottom:25px;
}

.line{
  max-width:900px;
  height:1px;
  background:rgba(255,255,255,.18);
  margin:0 auto 20px;
}

.copy{
  color:#9eafa8;
  font-size:14px;
}


/* ================= TABLET ================= */

@media(max-width:900px){

  .product-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


/* ================= MOBILE ================= */

@media(max-width:600px){

  .header{
    min-height:80px;
    padding:8px 12px;
  }

  .logo img{
    height:52px;
    max-width:160px;
  }

  .cart{
    font-size:16px;
    border-radius:18px;
    padding:7px 9px;
  }

  .cart-count{
    width:40px;
    height:40px;
  }

  main{
    padding:25px 12px 45px;
  }

  .title{
    font-size:25px;
  }

  .product-grid{
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .product-card img{
    height:170px;
  }

  .product-body{
    padding:11px;
  }

  .product-title{
    font-size:17px;
  }

  .price{
    font-size:19px;
  }

  .stock,
  .category{
    font-size:13px;
  }

  .add{
    font-size:14px;
    padding:9px;
  }

}


@media(max-width:380px){

  .logo img{
    max-width:140px;
  }

  .cart{
    font-size:14px;
  }

  .cart-count{
    width:36px;
    height:36px;
  }

  .product-card img{
    height:145px;
  }

  .product-title{
    font-size:15px;
  }

  .price{
    font-size:17px;
  }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

  <div class="header">

    <a
      href="index.html"
      class="logo"
    >

      <img
        src="logo.png.png"
        alt="ADORE'S PET"
      >

    </a>


    <a
      href="cart.html"
      class="cart"
    >

      🛒 Cart

      <span
        id="cartCount"
        class="cart-count"
      >
        0
      </span>

    </a>

  </div>

</header>



<!-- ================= MAIN ================= -->

<main>

  <a
    href="index.html"
    class="back"
  >
    ← Home
  </a>


  <h1
    id="pageTitle"
    class="title"
  >
    Product
  </h1>


  <div
    id="productGrid"
    class="product-grid"
  >

    <div
      class="message"
      style="grid-column:1/-1;"
    >
      ⏳ Product লোড হচ্ছে...
    </div>

  </div>

</main>



<!-- ================= FOOTER ================= -->

<footer>

  <div class="footer-title">
    🐰 ADORE'S PET
  </div>

  <div class="footer-text">
    আপনার বিশ্বস্ত Pet Shop
  </div>

  <div class="line"></div>

  <div class="copy">
    © 2026 ADORE'S PET — All Rights Reserved
  </div>

</footer>



<!-- ================= TOAST ================= -->

<div
  id="toast"
  class="toast"
></div>



<!-- ================= CONFIG ================= -->

<script src="config.js"></script>



<!-- ================= SUPABASE ================= -->

<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   SUPABASE
===================================================== */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const grid =
  document.getElementById(
    "productGrid"
  );

const pageTitle =
  document.getElementById(
    "pageTitle"
  );

const cartCount =
  document.getElementById(
    "cartCount"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   GET CATEGORY FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const selectedCategory =
  (params.get("category") || "")
    .trim();


/* =====================================================
   CATEGORY TITLE
===================================================== */

if(selectedCategory){

  pageTitle.textContent =
    selectedCategory;

}else{

  pageTitle.textContent =
    "All Products";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );


    if(!Array.isArray(cart)){

      cartCount.textContent =
        "0";

      return;

    }


    const total =
      cart.reduce(
        function(sum,item){

          return sum +
            (
              Number(
                item.quantity
              ) || 1
            );

        },
        0
      );


    cartCount.textContent =
      total;

  }

  catch(error){

    cartCount.textContent =
      "0";

  }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  toast.textContent =
    text;

  toast.style.display =
    "block";


  setTimeout(
    function(){

      toast.style.display =
        "none";

    },
    1800
  );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(product){

  try{

    let cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );


    if(!Array.isArray(cart)){

      cart=[];

    }


    const existing =
      cart.find(
        function(item){

          return String(item.id) ===
            String(product.id);

        }
      );


    if(existing){

      existing.quantity =
        (
          Number(
            existing.quantity
          ) || 1
        ) + 1;

    }

    else{

      cart.push({

        id:
          product.id,

        title:
          product.title,

        price:
          Number(
            product.price
          ) || 0,

        image:
          product.image_url || "",

        quantity:1

      });

    }


    localStorage.setItem(
      "cart",
      JSON.stringify(cart)
    );


    updateCartCount();


    showToast(
      "✅ Cart-এ Product যোগ হয়েছে"
    );

  }

  catch(error){

    console.error(error);

    showToast(
      "❌ Cart-এ যোগ করা যায়নি"
    );

  }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
  products
){

  if(
    !products ||
    products.length === 0
  ){

    grid.innerHTML = `

      <div
        class="message"
        style="grid-column:1/-1;"
      >

        📦 এই Category-তে
        কোনো Product নেই।

      </div>

    `;

    return;

  }


  grid.innerHTML =
    "";


  products.forEach(
    function(product){

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "product-card";


      const title =
        product.title ||
        "Product";


      const category =
        product.category ||
        "";


      const price =
        Number(
          product.price
        ) || 0;


      const stock =
        Number(
          product.stock
        ) || 0;


      const image =
        product.image_url ||
        "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f430.svg";


      card.innerHTML = `

        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(title)}"
          loading="lazy"
        >


        <div class="product-body">


          <div class="product-title">

            ${escapeHTML(title)}

          </div>


          <div class="category">

            Category:
            ${escapeHTML(category)}

          </div>


          <div class="price">

            ৳${price.toLocaleString("en-BD")}

          </div>


          <div class="stock">

            Stock:
            ${stock}

          </div>


          <button
            class="add"
            type="button"
          >

            🛒 Add to Cart

          </button>


        </div>

      `;


      const button =
        card.querySelector(
          ".add"
        );


      if(stock <= 0){

        button.disabled =
          true;

        button.textContent =
          "Out of Stock";

      }

      else{

        button.addEventListener(
          "click",
          function(){

            addToCart(
              product
            );

          }
        );

      }


      grid.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  grid.innerHTML = `

    <div
      class="message"
      style="grid-column:1/-1;"
    >

      ⏳ Product লোড হচ্ছে...

    </div>

  `;


  try{


    /*
      এখানে products table থেকে
      সব Product আনা হচ্ছে।
    */

    const {
      data,
      error
    } =
      await supabase
        .from("products")
        .select("*")
        .order(
          "id",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    let products =
      data || [];


    /*
      Category URL থাকলে
      JavaScript দিয়ে category মিলানো হচ্ছে।

      এতে Supabase query-র
      category case/format সমস্যা
      এড়ানো যাবে।
    */

    if(selectedCategory){

      const wanted =
        selectedCategory
          .trim()
          .toLowerCase();


      products =
        products.filter(
          function(product){

            const productCategory =
              String(
                product.category || ""
              )
              .trim()
              .toLowerCase();


            return
              productCategory ===
              wanted;

          }
        );

    }


    renderProducts(
      products
    );


  }

  catch(error){

    console.error(
      "PRODUCT ERROR:",
      error
    );


    grid.innerHTML = `

      <div
        class="message error"
        style="grid-column:1/-1;"
      >

        ❌ Product লোড করা যায়নি।

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

updateCartCount();

loadProducts();

</script>


</body>

</html>
