<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ADORE'S PET — Category</title>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Arial,
    "Noto Sans Bengali",
    "Noto Sans",
    sans-serif;

  background:#f6f9f7;
  color:#10251d;
  line-height:1.5;
}

a{
  text-decoration:none;
  color:inherit;
}

button{
  font-family:inherit;
}


/* =====================================================
   HEADER
===================================================== */

.site-header{

  width:100%;

  background:#fff;

  border-bottom:
    1px solid #dfe8e3;

  position:sticky;

  top:0;

  z-index:1000;

}


.header-inner{

  max-width:1200px;

  min-height:105px;

  margin:auto;

  padding:14px 24px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:20px;

}


.brand-logo{

  display:flex;

  align-items:center;

  height:78px;

}


.brand-logo img{

  display:block;

  height:72px;

  width:auto;

  max-width:280px;

  object-fit:contain;

}


.cart-btn{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  background:#19733f;

  color:#fff;

  border-radius:24px;

  min-width:190px;

  padding:12px 16px;

  font-size:20px;

  font-weight:700;

}


.cart-count{

  width:52px;

  height:52px;

  border-radius:50%;

  background:#fff;

  color:#19733f;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:22px;

  font-weight:800;

}


/* =====================================================
   MAIN
===================================================== */

main{

  min-height:calc(100vh - 300px);

}


.category-section{

  max-width:1200px;

  margin:auto;

  padding:55px 24px 80px;

}


/* =====================================================
   TOP
===================================================== */

.back-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  background:#19733f;

  color:#fff;

  border-radius:12px;

  padding:13px 25px;

  font-size:18px;

  font-weight:700;

  margin-bottom:35px;

}


.back-btn:hover{

  opacity:.9;

}


.category-title{

  text-align:center;

  color:#19733f;

  font-size:46px;

  font-weight:800;

  margin-bottom:55px;

}


/* =====================================================
   PRODUCT GRID
===================================================== */

.product-grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:28px;

}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{

  background:#fff;

  border:
    1px solid #d9e3de;

  border-radius:25px;

  overflow:hidden;

  box-shadow:
    0 5px 18px
    rgba(16,37,29,.06);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

}


.product-card:hover{

  transform:translateY(-4px);

  box-shadow:
    0 12px 30px
    rgba(16,37,29,.12);

}


.product-image{

  width:100%;

  aspect-ratio:1/1;

  object-fit:cover;

  display:block;

  background:#eef3f0;

}


.product-body{

  padding:20px;

}


.product-title{

  font-size:26px;

  font-weight:800;

  margin-bottom:8px;

  word-break:break-word;

}


.product-category{

  color:#777;

  font-size:17px;

  margin-bottom:12px;

}


.product-price{

  color:#19733f;

  font-size:28px;

  font-weight:800;

  margin-bottom:7px;

}


.product-stock{

  color:#666;

  font-size:16px;

  margin-bottom:18px;

}


.add-cart{

  width:100%;

  border:0;

  background:#19733f;

  color:#fff;

  padding:14px;

  border-radius:12px;

  font-size:18px;

  font-weight:800;

  cursor:pointer;

}


.add-cart:hover{

  background:#145d34;

}


.add-cart:disabled{

  background:#999;

  cursor:not-allowed;

}


/* =====================================================
   LOADING / EMPTY / ERROR
===================================================== */

.message{

  grid-column:1 / -1;

  text-align:center;

  padding:70px 20px;

  color:#777;

  font-size:24px;

}


.error{

  color:#c62828;

}


.loading{

  color:#19733f;

}


/* =====================================================
   TOAST
===================================================== */

#toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translateX(-50%);

  background:#19733f;

  color:#fff;

  padding:14px 22px;

  border-radius:12px;

  font-size:16px;

  font-weight:700;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.2);

  display:none;

  z-index:9999;

}


/* =====================================================
   FOOTER
===================================================== */

footer{

  background:#06251a;

  color:#fff;

  padding:
    55px 24px
    28px;

  text-align:center;

}


.footer-brand{

  font-size:30px;

  font-weight:800;

  margin-bottom:10px;

}


.footer-tagline{

  color:#b8c8c1;

  font-size:17px;

  margin-bottom:32px;

}


.footer-line{

  height:1px;

  background:
    rgba(255,255,255,.18);

  max-width:900px;

  margin:
    0 auto 22px;

}


.copyright{

  color:#9eafa8;

  font-size:14px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .header-inner{

    min-height:88px;

    padding:
      10px 16px;

  }


  .brand-logo{

    height:62px;

  }


  .brand-logo img{

    height:58px;

    max-width:175px;

  }


  .cart-btn{

    min-width:135px;

    border-radius:20px;

    padding:8px 10px;

    font-size:17px;

  }


  .cart-count{

    width:44px;

    height:44px;

    font-size:19px;

  }


  .category-section{

    padding:
      35px 18px
      55px;

  }


  .back-btn{

    font-size:17px;

    padding:
      12px 22px;

    margin-bottom:30px;

  }


  .category-title{

    font-size:36px;

    margin-bottom:40px;

  }


  .product-grid{

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

    gap:16px;

  }


  .product-card{

    border-radius:20px;

  }


  .product-body{

    padding:14px;

  }


  .product-title{

    font-size:20px;

  }


  .product-category{

    font-size:14px;

  }


  .product-price{

    font-size:21px;

  }


  .product-stock{

    font-size:14px;

  }


  .add-cart{

    font-size:14px;

    padding:12px 8px;

  }


  .message{

    font-size:18px;

    padding:60px 15px;

  }


  footer{

    padding:
      45px 18px
      25px;

  }


  .footer-brand{

    font-size:25px;

  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

  .brand-logo img{

    max-width:145px;

  }


  .cart-btn{

    min-width:115px;

    font-size:15px;

  }


  .cart-count{

    width:38px;

    height:38px;

    font-size:17px;

  }


  .category-title{

    font-size:32px;

  }


  .product-grid{

    gap:10px;

  }


  .product-body{

    padding:11px;

  }


  .product-title{

    font-size:17px;

  }


  .product-category{

    font-size:12px;

  }


  .product-price{

    font-size:18px;

  }


  .product-stock{

    font-size:12px;

  }


  .add-cart{

    font-size:12px;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

  <div class="header-inner">


    <a
      href="index.html"
      class="brand-logo"
    >

      <img
        src="logo.png.png"
        alt="ADORE'S PET"
      >

    </a>


    <a
      href="cart.html"
      class="cart-btn"
    >

      <span>🛒</span>

      <span>Cart</span>

      <span
        class="cart-count"
        id="cartCount"
      >
        0
      </span>

    </a>


  </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


<section class="category-section">


  <!-- BACK -->

  <a
    href="index.html"
    class="back-btn"
  >

    ← Home

  </a>



  <!-- CATEGORY TITLE -->

  <h1
    id="pageTitle"
    class="category-title"
  >
    Product
  </h1>



  <!-- PRODUCT GRID -->

  <div
    id="productGrid"
    class="product-grid"
  >

    <div class="message loading">

      ⏳ Product লোড হচ্ছে...

    </div>

  </div>


</section>

</main>



<!-- =====================================================
     TOAST
===================================================== -->

<div id="toast"></div>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

  <div class="footer-brand">

    🐰 ADORE'S PET

  </div>


  <div class="footer-tagline">

    আপনার বিশ্বস্ত Pet Shop

  </div>


  <div class="footer-line"></div>


  <div class="copyright">

    © 2026 ADORE'S PET — All Rights Reserved

  </div>

</footer>



<!-- =====================================================
     CONFIG
===================================================== -->

<script src="config.js"></script>



<!-- =====================================================
     SUPABASE + CATEGORY SCRIPT
===================================================== -->

<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =====================================================
   SUPABASE
===================================================== */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const productGrid =
  document.getElementById(
    "productGrid"
  );


const pageTitle =
  document.getElementById(
    "pageTitle"
  );


const cartCount =
  document.getElementById(
    "cartCount"
  );


const toast =
  document.getElementById(
    "toast"
  );


/* =====================================================
   GET CATEGORY FROM URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const selectedCategory =
  (
    params.get("category")
    || ""
  )
  .trim();


/* =====================================================
   PAGE TITLE
===================================================== */

pageTitle.textContent =
  selectedCategory
  || "All Products";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

  try{

    const cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );


    if(
      !Array.isArray(cart)
    ){

      cartCount.textContent =
        "0";

      return;

    }


    const count =
      cart.reduce(
        (
          total,
          item
        ) => {

          return (
            total +
            (
              Number(
                item.quantity
              ) || 1
            )
          );

        },
        0
      );


    cartCount.textContent =
      count;


  }catch(error){

    cartCount.textContent =
      "0";

  }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  toast.textContent =
    message;

  toast.style.display =
    "block";


  setTimeout(
    () => {

      toast.style.display =
        "none";

    },
    1800
  );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(product){

  let cart = [];


  try{

    cart =
      JSON.parse(
        localStorage.getItem(
          "cart"
        ) || "[]"
      );


    if(
      !Array.isArray(cart)
    ){

      cart = [];

    }

  }catch(error){

    cart = [];

  }


  const existing =
    cart.find(
      item =>
        String(item.id)
        ===
        String(product.id)
    );


  if(existing){

    existing.quantity =
      (
        Number(
          existing.quantity
        ) || 1
      ) + 1;

  }else{

    cart.push({

      id:
        product.id,

      title:
        product.title,

      price:
        Number(
          product.price
        ) || 0,

      image:
        product.image_url
        || "",

      quantity:
        1

    });

  }


  localStorage.setItem(
    "cart",
    JSON.stringify(cart)
  );


  updateCartCount();


  showToast(
    "✅ Product Cart-এ যোগ হয়েছে"
  );

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
  products
){

  if(
    !products.length
  ){

    productGrid.innerHTML = `

      <div
        class="message"
      >

        📦 এই Category-তে কোনো Product নেই।

      </div>

    `;

    return;

  }


  productGrid.innerHTML =
    "";


  products.forEach(
    product => {


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "product-card";


      const title =
        product.title
        || "Product";


      const category =
        product.category
        || "";


      const price =
        Number(
          product.price
        ) || 0;


      const stock =
        Number(
          product.stock
        ) || 0;


      const image =
        product.image_url
        ||
        "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f430.svg";


      card.innerHTML = `

        <img
          class="product-image"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(title)}"
          loading="lazy"
          onerror="
            this.src='https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f430.svg'
          "
        >


        <div
          class="product-body"
        >


          <div
            class="product-title"
          >

            ${escapeHTML(title)}

          </div>


          <div
            class="product-category"
          >

            Category:
            <b>
              ${escapeHTML(category)}
            </b>

          </div>


          <div
            class="product-price"
          >

            ৳${price.toLocaleString("en-BD")}

          </div>


          <div
            class="product-stock"
          >

            Stock:
            ${stock}

          </div>


          <button
            class="add-cart"
            type="button"
            ${stock <= 0 ? "disabled" : ""}
          >

            ${
              stock <= 0
              ? "Out of Stock"
              : "🛒 Add to Cart"
            }

          </button>


        </div>

      `;


      const addButton =
        card.querySelector(
          ".add-cart"
        );


      if(
        stock > 0
      ){

        addButton.addEventListener(
          "click",
          () => {

            addToCart(
              product
            );

          }
        );

      }


      productGrid.appendChild(
        card
      );


    }
  );

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

  productGrid.innerHTML = `

    <div
      class="message loading"
    >

      ⏳ Product লোড হচ্ছে...

    </div>

  `;


  try{


    /* ---------------------------------------------
       IMPORTANT:

       Database থেকে আগে সব Product নেওয়া হচ্ছে।
       তারপর JavaScript দিয়ে Category filter করা হচ্ছে।

       এতে URL category এবং Database category
       mismatch হওয়ার সমস্যা অনেকটাই কমে যাবে।
    --------------------------------------------- */


    const {
      data,
      error
    } =
      await supabase
        .from("products")
        .select(
          "*"
        )
        .order(
          "id",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    let products =
      data || [];


    /* ---------------------------------------------
       CATEGORY FILTER
    --------------------------------------------- */

    if(
      selectedCategory
    ){

      const wanted =
        selectedCategory
          .toLowerCase()
          .trim();


      products =
        products.filter(
          product => {


            const category =
              String(
                product.category
                || ""
              )
              .toLowerCase()
              .trim();


            /*
              Exact match অথবা
              category-এর মধ্যে wanted থাকলে match।
            */


            return (
              category === wanted
              ||
              category.includes(
                wanted
              )
            );

          }
        );

    }


    renderProducts(
      products
    );


  }catch(error){

    console.error(
      error
    );


    productGrid.innerHTML = `

      <div
        class="message error"
      >

        ❌ Product লোড করতে সমস্যা হয়েছে।

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   START
===================================================== */

updateCartCount();

loadProducts();

</script>


</body>

</html>
