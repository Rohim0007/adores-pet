<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adore's Pet | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Header Component -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-info">
                <div class="brand-logo"><i class="fa-solid fa-paw"></i></div>
                <div>
                    <h2>ADORE'S PET</h2>
                    <p>Rabbit & Hamster Specialist</p>
                </div>
            </a>
            <div class="nav-links-top">
                <a href="admin.html"><i class="fa-solid fa-lock"></i> Admin</a>
            </div>
        </div>
        <div class="search-box-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="খাবার বা খেলনা খুঁজুন..." onkeyup="filterProducts()">
            </div>
        </div>
    </header>

    <!-- Main Container & Cards -->
    <div class="container">
        <h2 style="font-size: 18px; margin-bottom: 15px;">জনপ্রিয় প্রোডাক্ট সমূহ</h2>
        <div class="product-grid" id="productGrid">
            <!-- Dynamic Cards will load here -->
        </div>
    </div>

    <!-- Footer Component -->
    <footer>
        <p>&copy; 2026 Adore's Pet Shop. All Rights Reserved.</p>
    </footer>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fa-solid fa-store"></i>
            <span>Shop</span>
        </a>
        <a href="checkout.html" class="nav-item">
            <div class="cart-icon-wrapper">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge" id="bottomCartCount">0</span>
            </div>
            <span>Cart</span>
        </a>
        <a href="admin.html" class="nav-item">
            <i class="fa-solid fa-user-gear"></i>
            <span>Admin</span>
        </a>
        <a href="https://wa.me/8801681578599" target="_blank" class="nav-item">
            <i class="fa-solid fa-headset"></i>
            <span>Support</span>
        </a>
    </nav>

    <script src="assets/js/main.js"></script>
</body>
</html>
