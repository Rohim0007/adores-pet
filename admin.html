<!doctype html>
<html lang="bn">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>ADORE'S PET — Admin Panel</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f8f6;
  color:#10251d;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

header{
  background:#176b3a;
  color:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:22px;
  font-weight:800;
}

header a{
  color:#fff;
  text-decoration:none;
  font-weight:700;
}

.admin{
  max-width:1100px;
  margin:auto;
  padding:25px 15px;
}

.panel{
  background:#fff;
  border-radius:18px;
  padding:25px;
  margin-bottom:25px;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.hidden{
  display:none !important;
}


/* =====================================================
   LOGIN
===================================================== */

.login-box{
  max-width:500px;
  margin:60px auto;
}

.login-box h1{
  text-align:center;
  color:#176b3a;
}

.input-group{
  margin-bottom:18px;
}

.input-group label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

.input-group input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.btn{
  border:0;
  background:#176b3a;
  color:#fff;
  padding:13px 20px;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

.logout{
  background:#c62828;
}

.cancel{
  background:#777;
}


/* =====================================================
   DASHBOARD
===================================================== */

.admin-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.admin-top h1{
  margin:0 0 5px;
}


/* =====================================================
   PRODUCT FORM
===================================================== */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1 / -1;
}

.form-group label{
  font-weight:700;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.form-group textarea{
  resize:vertical;
}

.preview{
  width:180px;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  margin-top:15px;
  border:1px solid #ddd;
  display:block;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
  flex-wrap:wrap;
}


/* =====================================================
   PRODUCT LIST
===================================================== */

.list-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.search{
  width:260px;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}


/* PRODUCT ITEM */

.product-item{
  display:flex;
  align-items:center;
  gap:15px;
  width:100%;
  max-width:100%;
  padding:15px 0;
  border-bottom:1px solid #ddd;
  overflow:hidden;
}


/* IMPORTANT IMAGE FIX */

.product-item img,
.product-image{
  width:90px !important;
  height:90px !important;

  min-width:90px !important;
  max-width:90px !important;

  min-height:90px !important;
  max-height:90px !important;

  object-fit:cover !important;
  border-radius:10px !important;

  background:#eee;
  display:block !important;

  flex-shrink:0 !important;
}


/* PRODUCT INFO */

.product-info{
  flex:1;
  min-width:0;
}

.product-info h3{
  margin:0 0 7px;
  word-break:break-word;
}

.product-info p{
  margin:4px 0;
  color:#666;
  word-break:break-word;
}


/* ACTIONS */

.product-actions{
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.edit-btn{
  border:0;
  background:#eee;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

.delete-btn{
  border:0;
  background:#c62828;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
}


/* =====================================================
   ORDERS
===================================================== */

.order-card{
  border:1px solid #ddd;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  background:#fff;
}

.order-card h3{
  margin-top:0;
}

.status{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#fff3cd;
  color:#856404;
  font-weight:700;
  font-size:13px;
}

.refresh{
  border:0;
  background:#176b3a;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  header{
    padding:16px 14px;
  }

  .brand{
    font-size:18px;
  }

  .admin{
    padding:15px 10px;
  }

  .panel{
    padding:18px;
    border-radius:15px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .admin-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .list-head{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    width:100%;
  }


  /* MOBILE PRODUCT IMAGE */

  .product-item{
    align-items:flex-start;
    gap:10px;
  }

  .product-item img,
  .product-image{
    width:70px !important;
    height:70px !important;

    min-width:70px !important;
    max-width:70px !important;

    min-height:70px !important;
    max-height:70px !important;
  }


  .product-info{
    min-width:0;
  }

  .product-info h3{
    font-size:17px;
  }

  .product-info p{
    font-size:14px;
  }

  .product-actions{
    flex-direction:column;
  }

  .edit-btn,
  .delete-btn{
    padding:7px 10px;
    font-size:13px;
  }

}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(max-width:420px){

  .product-item{
    gap:8px;
  }

  .product-item img,
  .product-image{
    width:60px !important;
    height:60px !important;

    min-width:60px !important;
    max-width:60px !important;

    min-height:60px !important;
    max-height:60px !important;
  }

  .product-info h3{
    font-size:15px;
  }

  .product-info p{
    font-size:13px;
  }

}


/* =====================================================
   MESSAGE
===================================================== */

#msg,
#loginMsg{
  margin-top:15px;
  font-weight:700;
}


/* =====================================================
   EMPTY PRODUCT / ORDER
===================================================== */

.empty{
  text-align:center;
  padding:30px 10px;
  color:#777;
}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="brand">
    🐰 ADORE'S PET — Admin
  </div>

  <a href="index.html">
    🌐 Website
  </a>

</header>



<main class="admin">


<!-- =====================================================
     LOGIN
===================================================== -->

<section
  id="loginBox"
  class="panel login-box"
>

  <h1>
    🔐 Admin Login
  </h1>

  <p style="text-align:center;">
    শুধু Admin Email ও Password দিয়ে প্রবেশ করুন।
  </p>


  <form id="loginForm">


    <div class="input-group">

      <label>
        Admin Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="admin@gmail.com"
        autocomplete="username"
        required
      >

    </div>


    <div class="input-group">

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

    </div>


    <button
      type="submit"
      class="btn"
      style="width:100%;"
    >
      🔐 Login
    </button>


  </form>


  <p id="loginMsg"></p>

</section>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<section
  id="dashboard"
  class="hidden"
>


<!-- TOP -->

<div class="admin-top">

  <div>

    <h1>
      🛒 Admin Dashboard
    </h1>

    <p>
      Product এবং Order পরিচালনা করুন।
    </p>

  </div>


  <button
    id="logout"
    class="btn logout"
    type="button"
  >
    Logout
  </button>

</div>



<!-- =====================================================
     PRODUCT UPLOAD
===================================================== -->

<section class="panel">

  <h2 id="formTitle">
    ➕ নতুন Product Upload
  </h2>


  <form id="productForm">


    <input
      type="hidden"
      id="id"
    >


    <div class="form-grid">


      <!-- PRODUCT NAME -->

      <div class="form-group">

        <label>
          Product Name
        </label>

        <input
          id="title"
          type="text"
          placeholder="যেমন: Flemish Giant Rabbit"
          required
        >

      </div>



      <!-- CATEGORY -->

      <div class="form-group">

        <label>
          Category
        </label>

        <select
          id="category"
          required
        >

          <option value="">
            Category নির্বাচন করুন
          </option>

          <option value="Rabbit">
            🐰 Rabbit
          </option>

          <option value="Hamster">
            🐹 Hamster
          </option>

          <option value="Pet Food">
            🌾 Pet Food
          </option>

          <option value="Accessories">
            🧺 Accessories
          </option>

        </select>

      </div>



      <!-- PRICE -->

      <div class="form-group">

        <label>
          Price (৳)
        </label>

        <input
          id="price"
          type="number"
          min="0"
          placeholder="1000"
          required
        >

      </div>



      <!-- STOCK -->

      <div class="form-group">

        <label>
          Stock
        </label>

        <input
          id="stock"
          type="number"
          min="0"
          placeholder="10"
          required
        >

      </div>



      <!-- IMAGE -->

      <div class="form-group full">

        <label>
          🖼️ Product Image
        </label>

        <input
          id="image"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        >

        <small>
          JPG / PNG / WEBP ছবি নির্বাচন করুন
        </small>

      </div>



      <!-- DESCRIPTION -->

      <div class="form-group full">

        <label>
          Product Description
        </label>

        <textarea
          id="description"
          rows="5"
          placeholder="Product সম্পর্কে বিস্তারিত লিখুন..."
        ></textarea>

      </div>


    </div>


    <!-- IMAGE PREVIEW -->

    <img
      id="preview"
      class="preview hidden"
      alt="Product Preview"
    >


    <!-- BUTTONS -->

    <div class="actions">

      <button
        id="saveProduct"
        class="btn"
        type="submit"
      >
        ✅ Save Product
      </button>


      <button
        id="cancel"
        class="btn cancel hidden"
        type="button"
      >
        Cancel
      </button>

    </div>


    <p id="msg"></p>


  </form>

</section>



<!-- =====================================================
     PRODUCT LIST
===================================================== -->

<section class="panel">


  <div class="list-head">

    <h2>
      📦 Product List
    </h2>


    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔍 Product Search"
    >

  </div>


  <div id="list">

    পণ্য লোড হচ্ছে...

  </div>


</section>



<!-- =====================================================
     ORDERS
===================================================== -->

<section class="panel">


  <div class="list-head">

    <h2>
      📋 Customer Orders
    </h2>


    <button
      id="refreshOrders"
      class="refresh"
      type="button"
    >
      🔄 Refresh
    </button>

  </div>


  <div id="ordersList">

    অর্ডার লোড হচ্ছে...

  </div>


</section>


</section>


</main>



<!-- =====================================================
     SCRIPTS
===================================================== -->

<script src="config.js"></script>

<script
  type="module"
  src="admin.js"
></script>


</body>

</html>
